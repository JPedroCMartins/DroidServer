                    html += linha(`<button type="button" data-ir="${esc(pai)}" class="flex items-center gap-3 flex-1 text-left text-muted hover:text-white">${svg(ICON.back, 'w-[18px] h-[18px] shrink-0')}<span class="text-[13px]">Voltar para ${esc(caminhoTela(pai))}</span></button>`);
                }
                html += visiveis.map((it, i) => {
                    const icone = it.tipo === 'pasta' ? svg(ICON.folder, 'w-[18px] h-[18px] shrink-0 text-accent2')
                        : it.tipo === 'link' ? svg(ICON.link, 'w-[18px] h-[18px] shrink-0 text-muted')
                            : svg(ICON.file, 'w-[18px] h-[18px] shrink-0 text-muted');
                    const nome = `<span class="truncate">${esc(it.nome)}</span>${it.link ? `<span class="shrink-0 text-muted" title="Link simbólico">${svg(ICON.link, 'w-3.5 h-3.5')}</span>` : ''}`;
                    const titulo = it.tipo === 'link' ? 'Link para fora de /root (não é seguido)' : it.nome;
                    const alvo = it.tipo === 'pasta'
                        ? `<button type="button" data-abrir="${i}" class="flex items-center gap-2 min-w-0 text-left text-[13.5px] font-medium text-slate-100 hover:text-accent" title="${esc(titulo)}">${nome}</button>`
                        : `<span class="flex items-center gap-2 min-w-0 text-[13.5px] ${it.tipo === 'link' ? 'text-muted' : ''}" title="${esc(titulo)}">${nome}</span>`;
                    const baixar = it.tipo === 'link' ? '' :
                        `<button type="button" data-baixar="${i}" class="btn btn-ghost !px-2.5 !py-1.5" title="${it.tipo === 'pasta' ? 'Baixar pasta (.zip)' : 'Baixar'}" aria-label="Baixar ${esc(it.nome)}">${svg(ICON.download)}</button>`;
                    return linha(`
                        <span class="flex items-center gap-3 flex-1 min-w-0">${icone}${alvo}</span>
                        <span class="hidden sm:block w-24 text-right text-[12.5px] text-muted shrink-0">${it.tipo === 'arquivo' ? fmtBytes(it.tamanho) : ''}</span>
                        <span class="hidden md:block w-36 text-right text-[12.5px] text-muted shrink-0">${quando(it.modificado)}</span>
                        <span class="flex gap-1.5 shrink-0">${baixar}
                            <button type="button" data-apagar="${i}" class="btn btn-danger !px-2.5 !py-1.5" title="Apagar" aria-label="Apagar ${esc(it.nome)}">${svg(ICON.trash)}</button></span>`);
                }).join('');
                const escondidos = itens.length - visiveis.length;
                if (!visiveis.length) {
                    html += `<div class="px-4 py-12 text-center text-[13px] text-muted">${svg(ICON.folder, 'w-8 h-8 mx-auto mb-2 opacity-60')}
                        Pasta vazia${escondidos ? ` (${escondidos} oculto(s) — marque “Ocultos”)` : ''}. Arraste arquivos para cá ou use “Enviar”.</div>`;
                } else if (escondidos) {
                    html += `<div class="px-4 py-2 text-[11.5px] text-muted">${escondidos} item(ns) oculto(s) — marque “Ocultos” para ver.</div>`;
                }
                lista.innerHTML = html;
            }

            async function carregar() {
                const minha = ++geracao;
                trilha();
                lista.innerHTML = `<div class="px-4 py-12 text-center text-[13px] text-muted">Carregando…</div>`;
                try {
                    const res = await fetch(api + q(caminho));
                    const data = await res.json().catch(() => ({}));
                    if (!vivo || minha !== geracao) return;
                    if (!res.ok || !data.ok) {
                        lista.innerHTML = `<div class="px-4 py-12 text-center text-[13px] text-bad">${esc(data.erro || 'Falha ao listar a pasta.')}</div>`;
                        if (res.status === 404 && caminho) lista.innerHTML += `<div class="text-center pb-8"><button type="button" data-ir="" class="btn btn-ghost">Ir para /root</button></div>`;
                        return;
                    }
                    itens = data.itens || [];
                    desenhar();
                    if (data.truncado) toast('Pasta grande: mostrando só os primeiros itens.');
                } catch (_) {
                    if (vivo && minha === geracao) lista.innerHTML = `<div class="px-4 py-12 text-center text-[13px] text-bad">Falha ao consultar o host.</div>`;
                }
            }

            function navegar(rel) {
                caminho = rel;
                history.pushState({}, '', base + (rel ? '?p=' + encodeURIComponent(rel) : ''));
                carregar();
            }

            function baixar(rel) {
                const f = $('fmBaixar');
                f.onload = () => {
                    // Download bem-sucedido não dispara onload; se carregou, é o JSON de erro.
                    let msg = 'Falha ao baixar.';
                    try { msg = JSON.parse(f.contentDocument.body.innerText).erro || msg; } catch (_) { }
                    toast(msg);
                };
                f.src = api + '/baixar' + q(rel) + '&_=' + Date.now();
                toast('Preparando o download…');
            }

            async function postar(rota, rel) {
                const res = await fetch(api + '/' + rota + q(rel), { method: 'POST' });
                return res.json().catch(() => ({ ok: false, erro: `Erro ${res.status}` }));
            }

            async function apagar(it) {
                const rel = juntar(caminho, it.nome);
                const oque = it.tipo === 'pasta' ? `a pasta "${it.nome}" e tudo o que há dentro dela` : `"${it.nome}"`;
                if (!confirm(`Apagar ${oque}? Não dá para desfazer.`)) return;
                const r = await postar('apagar', rel);
                toast(r.ok ? 'Apagado.' : (r.erro || 'Falha ao apagar.'));
                carregar();
            }

            async function novaPasta() {
                const nome = (prompt(`Nome da nova pasta em ${caminhoTela(caminho)}:`) || '').trim();
                if (!nome) return;
                if (nome.includes('/') || nome === '.' || nome === '..') { toast('Nome inválido.'); return; }
                const r = await postar('pasta', juntar(caminho, nome));
                toast(r.ok ? 'Pasta criada.' : (r.erro || 'Falha ao criar a pasta.'));
                carregar();
            }

            // ---- Envio: um arquivo por requisição, em sequência, com progresso ----
            function enviarUm(arquivo, rel, aoProgresso) {
                return new Promise((ok) => {
                    const xhr = new XMLHttpRequest();
                    xhrAtual = xhr;
                    xhr.open('POST', api + '/enviar' + q(rel));
                    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                    xhr.upload.onprogress = (e) => aoProgresso(e.loaded);
                    xhr.onload = () => {
                        if (xhr.status === 401) irParaLogin();
                        let d = {};
                        try { d = JSON.parse(xhr.responseText); } catch (_) { }
                        ok(xhr.status === 200 && d.ok ? null : (d.erro || `erro ${xhr.status}`));
                    };
                    xhr.onerror = () => ok('conexão perdida');
                    xhr.onabort = () => ok('cancelado');
                    xhr.send(arquivo);
                });
            }

            const avisoSaida = (e) => { if (enviando) { e.preventDefault(); e.returnValue = ''; } };
            window.addEventListener('beforeunload', avisoSaida);

            async function enviar(lote) {
                // lote: [{ file, rel }] e/ou [{ pasta: true, rel }] (rel relativo à pasta aberta)
                if (!lote.length) return;
                if (enviando) { toast('Aguarde o envio atual terminar.'); return; }
                const destino = caminho;
                const existentes = new Set(itens.map(i => i.nome));
                const conflitos = [...new Set(lote.map(x => x.rel.split('/')[0]))].filter(n => existentes.has(n));
                if (conflitos.length && !confirm(`Já existe(m) em ${caminhoTela(destino)}: ${conflitos.slice(0, 5).join(', ')}${conflitos.length > 5 ? '…' : ''}.\nOs arquivos com o mesmo nome serão substituídos. Continuar?`)) return;

                const arquivos = lote.filter(x => x.file);
                const total = arquivos.reduce((s, x) => s + x.file.size, 0) || 1;
                let feito = 0, cancelado = false;
                const erros = [];
                enviando = true;
                $('fmProgresso').classList.remove('hidden');
                $('fmProgErros').classList.add('hidden');
                $('fmCancelar').classList.remove('hidden');
                $('fmCancelar').onclick = () => { cancelado = true; if (xhrAtual) xhrAtual.abort(); };
                const pintar = (txt, bytes) => {
                    const pct = Math.min(100, Math.round(bytes / total * 100));
                    $('fmProgTexto').innerText = txt;
                    $('fmProgPct').innerText = pct + '%';
                    $('fmProgBarra').style.width = pct + '%';
                };

                for (const x of lote.filter(x => x.pasta)) {
                    const r = await postar('pasta', juntar(destino, x.rel));
                    if (!r.ok && !/já existe/i.test(r.erro || '')) erros.push(`${x.rel}: ${r.erro}`);
                }
                for (let i = 0; i < arquivos.length && vivo && !cancelado; i++) {
                    const { file, rel } = arquivos[i];
                    pintar(`Enviando ${i + 1}/${arquivos.length} — ${rel}`, feito);
                    const erro = await enviarUm(file, juntar(destino, rel), (n) => pintar(`Enviando ${i + 1}/${arquivos.length} — ${rel}`, feito + n));
                    if (erro && erro !== 'cancelado') erros.push(`${rel}: ${erro}`);
                    feito += file.size;
                }
                enviando = false;
                xhrAtual = null;
                if (!vivo) return;
                $('fmCancelar').classList.add('hidden');
                if (cancelado) pintar('Envio cancelado.', feito);
                else pintar(erros.length ? `Concluído com ${erros.length} falha(s).` : `${arquivos.length} arquivo(s) enviado(s).`, total);
                if (erros.length) {
                    $('fmProgErros').innerHTML = erros.slice(0, 8).map(esc).join('<br>') + (erros.length > 8 ? `<br>… e mais ${erros.length - 8}` : '');
                    $('fmProgErros').classList.remove('hidden');
                } else if (!cancelado) {
                    setTimeout(() => { if (vivo && !enviando) $('fmProgresso').classList.add('hidden'); }, 2500);
                }
                if (destino === caminho) carregar();
            }

            const doInput = (input) => {
                const lote = [...input.files].map(f => ({ file: f, rel: f.webkitRelativePath || f.name }));
                input.value = '';
                enviar(lote);
            };
            $('fmInArquivos').onchange = (e) => doInput(e.target);
            $('fmInPasta').onchange = (e) => doInput(e.target);
            $('fmBtnArquivos').onclick = () => $('fmInArquivos').click();
            $('fmBtnPasta').onclick = () => $('fmInPasta').click();
            $('fmNovaPasta').onclick = novaPasta;
            $('fmAtualizar').onclick = carregar;
            $('fmBaixarAtual').onclick = () => baixar(caminho);
            $('fmOcultos').onchange = (e) => {
                ocultos = e.target.checked;
                try { localStorage.setItem('fmOcultos', ocultos ? '1' : '0'); } catch (_) { }
                desenhar();
            };

            $('view').querySelector('section').addEventListener('click', (e) => {
                const b = e.target.closest('button');
                if (!b) return;
                if (b.dataset.ir !== undefined) return navegar(b.dataset.ir);
                if (b.dataset.abrir !== undefined) return navegar(juntar(caminho, visiveis[+b.dataset.abrir].nome));
                if (b.dataset.baixar !== undefined) return baixar(juntar(caminho, visiveis[+b.dataset.baixar].nome));
                if (b.dataset.apagar !== undefined) return apagar(visiveis[+b.dataset.apagar]);
            });

            // ---- Arrastar e soltar (arquivos e pastas inteiras) ----
            const area = $('fmArea'), soltar = $('fmSoltar');
            let dentro = 0;
            const temArquivos = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
            const mostrar = (v) => { soltar.classList.toggle('hidden', !v); soltar.classList.toggle('flex', v); };
            area.addEventListener('dragenter', (e) => { if (!temArquivos(e)) return; e.preventDefault(); dentro++; mostrar(true); });
            area.addEventListener('dragover', (e) => { if (temArquivos(e)) e.preventDefault(); });
            area.addEventListener('dragleave', () => { if (--dentro <= 0) { dentro = 0; mostrar(false); } });

            const lerTodas = (leitor) => new Promise((ok, erro) => leitor.readEntries(ok, erro));
            async function lerEntrada(entrada, prefixo, saida) {
                if (entrada.isFile) {
                    const f = await new Promise((ok, erro) => entrada.file(ok, erro));
                    saida.push({ file: f, rel: prefixo + f.name });
                } else if (entrada.isDirectory) {
                    const leitor = entrada.createReader();
                    const filhos = [];
                    let parte;
                    do { parte = await lerTodas(leitor); filhos.push(...parte); } while (parte.length);
                    if (!filhos.length) saida.push({ pasta: true, rel: prefixo + entrada.name });
                    for (const f of filhos) await lerEntrada(f, prefixo + entrada.name + '/', saida);
                }
            }
            area.addEventListener('drop', async (e) => {
                if (!temArquivos(e)) return;
                e.preventDefault();
                dentro = 0; mostrar(false);
                const entradas = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
                const soltos = [...e.dataTransfer.files];
                const lote = [];
                try {
                    if (entradas.length) for (const en of entradas) await lerEntrada(en, '', lote);
                    else soltos.forEach(f => lote.push({ file: f, rel: f.name }));
                } catch (_) { toast('Não foi possível ler os itens soltos.'); return; }
                enviar(lote);
            });

            carregar();

            cleanup = () => {
                vivo = false;
                if (xhrAtual) xhrAtual.abort();
                window.removeEventListener('beforeunload', avisoSaida);
            };
        }

        route();
    </script>
</body>

</html>
