<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidServer — Painel de Orquestração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">DS</div>
                <div class="brand-text">
                    <strong>DroidServer</strong>
                    <span>Cluster</span>
                </div>
            </div>

            <nav class="nav">
                <span class="nav-label">Menu</span>
                <a href="/" class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    Dashboard
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="legend">
                    <span class="status-dot online"></span>
                    Online
                </div>
                <div class="legend">
                    <span class="status-dot offline"></span>
                    Offline
                </div>
                <div style="margin-top:8px; font-size:11.5px;">
                    Host Flask + Socket.IO — porta 5050
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h1>Dashboard</h1>
                    <p class="subtitle">Visão geral do cluster e dos nodes conectados.</p>
                </div>
                <div class="topbar-actions">
                    <span class="updated-at">
                        <span class="live-dot"></span>
                        Atualizado em <span id="updatedAt">—</span>
                    </span>
                    <button class="btn btn-ghost btn-sm" onclick="refreshNow()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                        Atualizar
                    </button>
                </div>
            </header>

            <section class="stats">
                <div class="stat-card">
                    <div class="stat-icon primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statNodes">0</div>
                        <div class="stat-label">Nodes totais</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statOnline">0</div>
                        <div class="stat-label">Nodes online</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon cyan">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statWorkers">0</div>
                        <div class="stat-label">Workers ativos</div>
                    </div>
                </div>
            </section>

            <div class="section-head">
                <h2>Nodes conectados</h2>
                <span class="count" id="nodeCount">0 nodes</span>
            </div>

            <section class="node-grid" id="nodeGrid">
                <div class="skeleton"></div>
                <div class="skeleton"></div>
            </section>
        </main>
    </div>

    <script>
        const grid = document.getElementById('nodeGrid');
        const updatedAt = document.getElementById('updatedAt');
        const countBadge = document.getElementById('nodeCount');

        function esc(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function fmtBytes(n) {
            if (n == null) return '—';
            const u = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
            return `${n.toFixed(1)} ${u[i]}`;
        }

        function metricBar(label, pct, sub) {
            const p = (pct == null) ? 0 : Math.max(0, Math.min(100, pct));
            const val = (pct == null) ? '—' : `${pct}%`;
            return `
            <div class="metric">
                <div class="metric-head">
                    <span class="metric-label">${label}</span>
                    <span class="metric-value">${val}</span>
                </div>
                <div class="bar"><div class="bar-fill" style="width:${p}%"></div></div>
                ${sub ? `<div class="metric-sub">${sub}</div>` : ''}
            </div>`;
        }

        function nodeCard(ip, info) {
            const workers = info.workers || [];
            const status = info.status || 'Offline';
            const isOnline = status.toLowerCase() === 'online';
            const lastSeen = info.last_seen || '—';

            const mem = info.mem || {};
            const memSub = mem.total ? `${fmtBytes(mem.usado)} / ${fmtBytes(mem.total)}` : null;

            const workerChips = workers.length
                ? workers.map(w => `<span class="chip">${esc(w)}</span>`).join('')
                : '<span class="muted" style="font-size:12.5px;">Nenhum worker instalado</span>';

            return `
            <article class="node-card">
                <div class="node-card-top">
                    <div class="node-ip">
                        <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                        <span class="ip-text">${esc(ip)}</span>
                    </div>
                    <span class="pill ${isOnline ? 'pill-online' : 'pill-offline'}">${esc(status)}</span>
                </div>
                <div class="node-meta">
                    <div class="meta-item">
                        <span class="meta-label">Último contato</span>
                        <span class="meta-value">${esc(lastSeen)}</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Workers</span>
                        <span class="meta-value">${workers.length}</span>
                    </div>
                </div>
                <div class="node-metrics">
                    ${metricBar('CPU', info.cpu)}
                    ${metricBar('RAM', mem.percent, memSub)}
                </div>
                <div class="node-workers">${workerChips}</div>
                <div class="node-actions">
                    <a href="/node/${esc(ip)}" class="btn btn-primary btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6 6-6"/></svg>
                        Gerenciar Workers
                    </a>
                </div>
            </article>`;
        }

        function emptyState() {
            return `
            <div class="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg>
                <h3>Nenhum node conectado</h3>
                <p>Rode o agente <strong>node.py</strong> em um dispositivo Android para vê-lo aqui.</p>
            </div>`;
        }

        async function fetchNodes() {
            try {
                const res = await fetch('/api/nodes');
                const data = await res.json();
                renderNodes(data);
            } catch (err) {
                grid.innerHTML = `<div class="empty"><h3>Falha ao consultar o host</h3><p>${esc(err.message)}</p></div>`;
            }
        }

        function renderNodes(nodes) {
            const entries = Object.entries(nodes || {});
            const online = entries.filter(([, i]) => (i.status || 'Offline').toLowerCase() === 'online');

            document.getElementById('statNodes').textContent = entries.length;
            document.getElementById('statOnline').textContent = online.length;
            document.getElementById('statWorkers').textContent = entries.reduce((acc, [, i]) => acc + (i.workers || []).length, 0);
            countBadge.textContent = `${entries.length} ${entries.length === 1 ? 'node' : 'nodes'}`;
            updatedAt.textContent = new Date().toLocaleTimeString('pt-BR');

            if (!entries.length) {
                grid.innerHTML = emptyState();
                return;
            }

            const isOnline = (info) => (info.status || 'Offline').toLowerCase() === 'online';
            entries.sort((a, b) => isOnline(b[1]) - isOnline(a[1]));
            grid.innerHTML = entries.map(([ip, info]) => nodeCard(ip, info)).join('');
        }

        function refreshNow() {
            grid.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
            fetchNodes();
        }

        fetchNodes();
        setInterval(fetchNodes, 5000);
    </script>
</body>
</html>
