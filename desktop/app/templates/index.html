                const disco = sv.disco_mb === undefined ? '—' : (sv.disco_mb === null ? 'calculando…' : fmt(sv.disco_mb, ' MB'));
                $('svRecursos').textContent = [
                    `CPU ${fmt(cpuWorker, '%')}`, `RAM ${fmt(sv.ram_mb, ' MB')}`, `Disco ${disco}`,
                    sv.distro || '—',
                    ...(banco ? [] : [`run.sh salvo ${sv.script_salvo_em ? haQuanto(sv.script_salvo_em) : '—'}`]),
                ].join(' · ');
            }

            // Worker de banco: sem run.sh; mostra a conexão no lugar do editor
            let ehBanco = false;
            let bancoInfo = {};
            function aplicarBanco(sv) {
                if (sv.tipo !== 'postgres') return;
                if (!ehBanco) {
                    ehBanco = true;
                    $('secScript').classList.add('hidden');
                    $('secConexao').classList.remove('hidden');
                    $('svSub').innerHTML = `Node ${esc(ip)} — banco PostgreSQL rodando no Termux, vigiado pelo DroidServer.`;
                }
                bancoInfo = sv.banco || {};
                $('cxPorta').textContent = bancoInfo.porta || sv.porta || '—';
                const sel = $('cxSeletor');
                const nomes = Array.isArray(bancoInfo.bancos) ? bancoInfo.bancos : [];
                const chave = JSON.stringify([bancoInfo.banco, nomes]);
                if (sel.dataset.chave !== chave) {
                    const atual = sel.value;
                    sel.dataset.chave = chave;
                    sel.innerHTML = `<option value="">${esc(bancoInfo.banco || 'postgres')} (admin)</option>`
                        + nomes.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
                    sel.value = nomes.includes(atual) ? atual : '';
                }
                mostrarSelecionado();
            }

            function mostrarEstado(sv) {
                aplicarBanco(sv);
                // A RAM só vem no sync; uma resposta de comando chega sem ela
                if (sv.ram_mb === undefined && ultimoEstado && ultimoEstado.ram_mb !== undefined) sv = { ...sv, ram_mb: ultimoEstado.ram_mb };
                ultimoEstado = sv;
                mostrarVisaoGeral(sv);
                const e = estadoServico(sv);
                $('svDot').className = 'dot ' + TOM_DOT[e.tone];
                $('svEstado').className = 'text-[16px] font-bold ' + TOM_TXT[e.tone];
                $('svEstado').textContent = e.label;
                const partes = [];
                if (sv.pid) partes.push(`pid ${sv.pid}`);
                if (sv.uptime) partes.push(`no ar há ${sv.uptime}`);
                if (sv.estado && e.tone !== 'ok') partes.push(`Supervisor: ${sv.estado}`);
                $('svInfo').textContent = partes.join(' · ') || '—';

                const rodando = ['RUNNING', 'STARTING', 'BACKOFF'].includes(sv.estado);
                document.querySelector('[data-acao="iniciar"]').disabled = rodando;
                document.querySelector('[data-acao="parar"]').disabled = !rodando;

                let alerta = '';
                if (!sv.gerenciado) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-warn/30 bg-warn/10 text-[13px]">Este worker ainda não usa o lançador do DroidServer. Reinicie o agente no celular para migrá-lo.</div>`;
                } else if (!sv.tem_script) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-accent2/30 bg-accent2/10 text-[13px]"><strong>Nenhum /app/run.sh ainda.</strong> Escreva o serviço abaixo (ou use “Inserir exemplo”) e clique em <strong>Salvar e reiniciar</strong> — ele sobe sozinho.</div>`;
                } else if (ehBanco && ['FATAL', 'BACKOFF'].includes(sv.estado)) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-bad/30 bg-bad/10 text-[13px]">
                        <strong>O PostgreSQL termina logo depois de iniciar.</strong> Veja os logs abaixo: causas comuns são a porta já usada por outro serviço ou falta de memória no celular.
                        ${sv.detalhe ? `<div class="mt-1 text-muted">Supervisor: ${esc(sv.detalhe)}</div>` : ''}</div>`;
                } else if (['FATAL', 'BACKOFF'].includes(sv.estado)) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-bad/30 bg-bad/10 text-[13px]">
                        <strong>O serviço termina logo depois de iniciar.</strong> Causas comuns: um comando que não existe no worker (instale pelo Terminal), um erro no programa (veja os logs abaixo) ou o serviço indo para segundo plano com <code>&amp;</code>/<code>nohup</code>.
                        ${sv.detalhe ? `<div class="mt-1 text-muted">Supervisor: ${esc(sv.detalhe)}</div>` : ''}</div>`;
                }
                $('svAlerta').innerHTML = alerta;

                if (document.activeElement !== $('optAutostart')) $('optAutostart').checked = sv.autostart !== false;
                if (document.activeElement !== $('optAutorestart')) $('optAutorestart').checked = sv.autorestart !== false;
            }

            async function carregarEstado() {
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}`);
                    if (!res.ok) return;
                    const n = await res.json();
                    cpuWorker = (n.cpu_workers || {})[alias];
                    const sv = (n.servicos || {})[alias];
                    if (sv) mostrarEstado(sv);
                    else if (!(n.workers || []).includes(alias)) {
                        $('svEstado').textContent = 'Worker não encontrado neste node';
                    }
                } catch (e) { }
            }

            document.querySelectorAll('[data-acao]').forEach(b => b.addEventListener('click', async () => {
                const acao = b.dataset.acao;
                b.disabled = true;
                const r = await comando(acao);
                toast(r.msg || (r.ok ? 'Feito' : 'Falhou'));
                b.disabled = false;
                if (ultimoEstado) mostrarEstado(ultimoEstado);
            }));

            $('btnTestar').addEventListener('click', async () => {
                const b = $('btnTestar');
                b.disabled = true;
                $('svTeste').className = 'text-[12px] text-muted';
                $('svTeste').textContent = 'testando…';
                try {
                    const resp = await fetch(`/api/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}/testar`,
                        { method: 'POST' });
                    const r = await resp.json().catch(() => ({}));
                    $('svTeste').className = 'text-[12px] ' + (r.ok ? 'text-ok' : 'text-bad');
                    $('svTeste').textContent = r.ok ? `✓ ${r.status} em ${String(r.ms).replace('.', ',')} ms` : `✗ ${r.erro || 'falhou'}`;
                } catch (e) {
                    $('svTeste').className = 'text-[12px] text-bad';
                    $('svTeste').textContent = '✗ o Host não respondeu';
                }
                b.disabled = false;
            });

            async function configurar(chave, valor) {
                const r = await comando('configurar', { [chave]: valor });
                toast(r.ok ? 'Configuração salva' : (r.msg || 'Falhou'));
                $('optNota').textContent = r.ok ? 'Vale a partir da próxima reinicialização do serviço.' : '';
            }
            $('optAutostart').addEventListener('change', (e) => configurar('autostart', e.target.checked));
            $('optAutorestart').addEventListener('change', (e) => configurar('autorestart', e.target.checked));

            // ---- Conexão do banco (senha só sob pedido, direto do node) ----
            // Senhas pedidas ao node, uma por banco ('' = admin), guardadas só nesta página
            const creds = new Map();
            const NOME_BANCO_RE = /^[a-z_][a-z0-9_]{0,62}$/;
            const RESERVADOS = new Set(['postgres', 'template0', 'template1', 'droidserver', 'public']);
            const selecionado = () => $('cxSeletor').value;
            const senhaVisivel = () => $('btnSenha').dataset.visivel === '1';
            async function obterCredenciais() {
                const nome = selecionado();
                if (creds.has(nome)) return creds.get(nome);
                const r = await comando('credenciais', nome ? { banco: nome } : {});
                if (!r.ok) { toast(r.msg || 'Não foi possível obter a senha'); return null; }
                creds.set(nome, r.dados);
                return r.dados;
            }
            const urlConexao = (c) => `postgresql://${encodeURIComponent(c.usuario)}:${encodeURIComponent(c.senha)}@${ip}:${c.porta}/${encodeURIComponent(c.banco)}`;
            function mostrarSelecionado() {
                const nome = selecionado();
                $('cxUsuario').textContent = nome || bancoInfo.usuario || '—';
                $('cxBanco').textContent = nome || bancoInfo.banco || '—';
                $('btnApagarBanco').classList.toggle('hidden', !nome);
                const c = senhaVisivel() ? creds.get(nome) : null;
                $('cxSenha').textContent = c ? c.senha : '••••••••';
                if (c) $('cxUrl').value = urlConexao(c);
                $('cxUrl').classList.toggle('hidden', !c);
                montarComandos(c);
            }
            // Comandos de migração (rodam no computador do usuário, contra a porta do banco)
            function montarComandos(c) {
                const nome = selecionado();
                const usuario = nome || bancoInfo.usuario || 'droidserver';
                const banco = nome || bancoInfo.banco || 'postgres';
                const destino = c ? urlConexao(c) : `postgresql://${usuario}:SENHA@${ip}:${bancoInfo.porta || 5432}/${banco}`;
                const linhas = [
                    ['Importar de outro servidor', `pg_dump --no-owner --no-acl "postgresql://usuario:senha@origem:5432/banco" | psql "${destino}"`],
                    ['Fazer backup', `pg_dump -Fc "${destino}" -f ${banco}.dump`],
                    ['Restaurar um backup', `pg_restore --no-owner --no-acl -d "${destino}" ${banco}.dump`],
                ];
                if (!nome) {
                    linhas.push(['Instância inteira: backup (todos os bancos e usuários)', `pg_dumpall -d "${destino}" -f instancia.sql`]);
                    linhas.push(['Instância inteira: restaurar numa instância nova', `psql -d "${destino}" -f instancia.sql`]);
                }
                $('cxComandos').innerHTML = linhas.map(([t, cmd]) => `
                    <label class="flex flex-col gap-1">
                        <span class="label-xs tracking-wider">${esc(t)}</span>
                        <input readonly class="input font-mono text-[12px] !py-1.5" value="${esc(cmd)}" data-selecionar>
                    </label>`).join('');
            }
            $('cxComandos').addEventListener('focusin', (e) => { if (e.target.matches('[data-selecionar]')) e.target.select(); });
            $('cxSeletor').addEventListener('change', async () => {
                if (senhaVisivel()) await obterCredenciais();
                mostrarSelecionado();
            });
            $('btnSenha').addEventListener('click', async () => {
                if (senhaVisivel()) {
                    $('btnSenha').dataset.visivel = '0';
                    $('btnSenha').textContent = 'Mostrar senha';
                    mostrarSelecionado();
                    return;
                }
                const c = await obterCredenciais();
                if (!c) return;
                $('btnSenha').dataset.visivel = '1';
                $('btnSenha').textContent = 'Ocultar senha';
                mostrarSelecionado();
            });
            $('btnNovoBanco').addEventListener('click', async () => {
                const nome = (prompt('Nome do novo banco (minúsculas, dígitos e _). O usuário dono terá o mesmo nome:') || '').trim();
                if (!nome) return;
                if (!NOME_BANCO_RE.test(nome) || RESERVADOS.has(nome)) { toast('Nome inválido ou reservado'); return; }
                $('btnNovoBanco').disabled = true;
                try {
                    const r = await comando('criar_banco', { nome });
                    toast(r.msg || (r.ok ? 'Banco criado' : 'Falha ao criar o banco'));
                    if (r.ok) { $('cxSeletor').value = nome; mostrarSelecionado(); }
                } finally { $('btnNovoBanco').disabled = false; }
            });
            $('btnApagarBanco').addEventListener('click', async () => {
                const nome = selecionado();
                if (!nome) return;
                const digitado = prompt(`Apagar o banco "${nome}" e o usuário "${nome}"? Os dados são perdidos e quem estiver conectado é desconectado. Digite o nome do banco para confirmar:`);
                if (digitado === null) return;
                if (digitado.trim() !== nome) { toast('O nome não confere; nada foi apagado'); return; }
                $('btnApagarBanco').disabled = true;
                try {
                    const r = await comando('apagar_banco', { nome });
                    toast(r.msg || (r.ok ? 'Banco apagado' : 'Falha ao apagar o banco'));
                    if (r.ok) { creds.delete(nome); $('cxSeletor').value = ''; mostrarSelecionado(); }
                } finally { $('btnApagarBanco').disabled = false; }
            });
            $('btnCopiarUrl').addEventListener('click', async () => {
                const c = await obterCredenciais();
                if (!c) return;
                const url = urlConexao(c);
                try {
                    await navigator.clipboard.writeText(url);
                    toast('URL de conexão copiada');
                } catch (e) {
                    // Fora de HTTPS o navegador bloqueia a área de transferência: seleciona para Ctrl+C
                    $('cxUrl').value = url;
                    $('cxUrl').classList.remove('hidden');
                    $('cxUrl').focus();
                    $('cxUrl').select();
                    toast('URL selecionada: use Ctrl+C');
                }
            });

            // ---- Editor do /app/run.sh ----
            const ed = $('editor');
            let salvo = '';
            const numerar = () => {
                const n = Math.max(1, ed.value.split('\n').length);
                $('edLinhas').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
                $('edLinhas').scrollTop = ed.scrollTop;
            };
            const marcarSujo = () => { $('edSujo').classList.toggle('hidden', ed.value === salvo); numerar(); };
            ed.addEventListener('scroll', () => { $('edLinhas').scrollTop = ed.scrollTop; });
            const mostrarAvisos = (avisos) => {
                $('edAvisos').innerHTML = (avisos || []).map(a =>
                    `<div class="px-3.5 py-2.5 rounded-xl border border-warn/30 bg-warn/10 text-[12.5px]">⚠ ${esc(a)}</div>`).join('');
            };
            ed.addEventListener('input', marcarSujo);
            ed.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {   // Tab insere espaços em vez de sair do campo
                    e.preventDefault();
                    const i = ed.selectionStart;
                    ed.setRangeText('    ', i, ed.selectionEnd, 'end');
                    marcarSujo();
                }
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); salvar(false); }
            });

            async function carregarScript() {
                const r = await comando('ler_script');
                ed.disabled = false;
                if (!r.ok) { toast(r.msg || 'Não foi possível ler o run.sh'); return; }
                salvo = (r.dados && r.dados.conteudo) || '';
                ed.value = salvo;
                ed.placeholder = '#!/bin/sh\ncd /app\nexec seu-programa';
                mostrarAvisos(r.dados && r.dados.avisos);
                marcarSujo();
            }

            async function salvar(reiniciar) {
                const conteudo = ed.value;
                if (!conteudo.trim() && !confirm('O run.sh está vazio. Salvar assim mesmo?')) return;
                $('btnSalvar').disabled = $('btnSalvarReiniciar').disabled = true;
                const r = await comando('salvar_script', { conteudo, reiniciar });
                $('btnSalvar').disabled = $('btnSalvarReiniciar').disabled = false;
                toast(r.msg || (r.ok ? 'Salvo' : 'Falhou'));
                if (r.ok || (r.msg || '').startsWith('run.sh salvo')) { salvo = conteudo; marcarSujo(); }
                mostrarAvisos(r.dados && r.dados.avisos);
            }
            $('btnSalvar').addEventListener('click', () => salvar(false));
            $('btnSalvarReiniciar').addEventListener('click', () => salvar(true));
            $('btnExemplo').addEventListener('click', async () => {
                if (ed.value.trim() && !confirm('Substituir o conteúdo do editor pelo exemplo? (nada é salvo até você clicar em Salvar)')) return;
                const r = await comando('exemplo');
                if (r.ok) { ed.value = r.dados.conteudo; marcarSujo(); ed.focus(); }
            });

            // ---- Logs ao vivo ----
            const logs = painelLogs(ip, alias, {
                vazio: 'Sem saída ainda. O que o serviço imprimir aparece aqui.',
                aoReconectar: () => carregarEstado(),
            });

            // ---- Ciclo de vida da view ----
            // o run.sh só existe nos ambientes Linux (um worker de banco não tem)
            carregarEstado().then(() => { if (!ehBanco) carregarScript(); });
            const onUpd = (data) => { if (data && data.ip === ip) carregarEstado(); };
            socket.on('node_updated', onUpd);
            const timer = setInterval(carregarEstado, 10000);
            cleanup = () => {
                clearInterval(timer);
                logs.parar();
                socket.off('servico_resposta', onResposta);
                socket.off('node_updated', onUpd);
                document.removeEventListener('keydown', onTeclaAjuda);
                pendentes.forEach(fn => fn({ ok: false, msg: 'cancelado' }));
            };
        }

        // =====================================================================
        // Cloudflare Tunnel: envio do token e vigia da tarefa
        //   POST /node/<ip>/tunnel {token}  -> fila do node (configurar_tunnel)
        //   POST /node/<ip>/tunnel/delete   -> fila do node (remover_tunnel)
        // O token nunca volta do host: o painel só vê os últimos 4 caracteres.
        // =====================================================================
        function extrairToken(texto) {
            texto = (texto || '').trim();
            const m = texto.match(/--token\s+(\S+)/);
            return m ? m[1] : texto;
        }

        async function enviarTokenTunnel(ip, texto, vigia) {
            const token = extrairToken(texto);
            if (!TUNNEL_TOKEN_RE.test(token)) { toast('Token inválido: cole o token do tunnel ou o comando com --token'); return false; }
            try {
                const resp = await fetch(`/node/${encodeURIComponent(ip)}/tunnel`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }),
                });
                const r = await resp.json().catch(() => ({}));
                if (!resp.ok) { toast(r.erro || 'Falha ao enviar'); return false; }
                vigia.esperar(r.token_fim);
                toast('Token enviado ao node');
                return true;
            } catch (e) { toast('Falha ao enviar'); return false; }
        }

        // A fila do Host entrega cada tarefa no máximo uma vez: se a resposta do
        // sync se perder, a configuração some. A vigia avisa quando o node não
        // confirma (token novo nem resultado) bem depois de a tarefa sair da fila.
        const vigiasTunnel = {};
        function tunnelVigia(ip) {
            if (vigiasTunnel[ip]) return vigiasTunnel[ip];
            let esperado = null, resultados = 0, sumiuEm = null;
            const contar = (n) => (n.resultados || []).filter(r => r.acao === 'configurar_tunnel').length;
            return (vigiasTunnel[ip] = {
                esperar(fim) { esperado = fim; resultados = null; sumiuEm = null; },
                atualizar(n) {
                    if (!esperado) return false;
                    if (resultados === null) resultados = contar(n);
                    const tn = n.tunnel || {};
                    const naFila = [n.tarefa_atual, ...(n.tarefas_pendentes || [])].some(t => t && t.acao === 'configurar_tunnel');
                    if (tn.token_fim === esperado || contar(n) > resultados) { esperado = null; return false; }
                    if (naFila) { sumiuEm = null; return false; }
                    sumiuEm = sumiuEm || Date.now();
                    return Date.now() - sumiuEm > 25000;
                },
            });
        }

        // =====================================================================
        // VIEW: Tunnel (estado, iniciar/parar, token e logs do cloudflared)
        //   reaproveita os eventos da aba Serviço com o alias "tunnel"
        // =====================================================================
        function viewTunnel(ip) {
            setNav(ip);
            setFooter(`<div class="flex items-center gap-2"><span class="dot dot-online !w-[9px] !h-[9px]"></span>Logs ao vivo</div>`);
            const alias = TUNNEL;
            const vigia = tunnelVigia(ip);

            $('view').innerHTML = `
            <div class="max-w-[1400px] px-5 md:px-10 pt-6 md:pt-9 pb-14 flex flex-col gap-6">
                <header class="flex items-end justify-between gap-4 flex-wrap">
                    <div>
                        <h1 class="section-title text-[26px] tracking-tight flex items-center gap-2.5">${svg(ICON.cloud, 'w-7 h-7 text-accent2')}Tunnel Cloudflare</h1>
                        <p class="mt-1 text-[13.5px] text-muted">Node ${esc(ip)} — <code class="text-slate-300">cloudflared tunnel run</code> no Termux, vigiado pelo DroidServer.</p>
                    </div>
                    <a href="/node/${esc(ip)}" data-link class="btn btn-ghost">${svg(ICON.back)}Voltar ao node</a>
                </header>

                <section class="card card-static p-5 flex flex-col gap-4">
                    <div class="flex items-center justify-between gap-4 flex-wrap">
                        <div class="flex items-center gap-3">
                            <span class="dot dot-idle" id="svDot"></span>
                            <div>
                                <div class="text-[16px] font-bold" id="svEstado">Carregando…</div>
                                <div class="text-[12px] text-muted" id="svInfo">—</div>
                            </div>
                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button class="btn btn-success !py-2" data-acao="iniciar">${svg(ICON.play)}Iniciar</button>
                            <button class="btn btn-danger" data-acao="parar">${svg(ICON.stop)}Parar</button>
                            <button class="btn btn-primary" data-acao="reiniciar">${svg(ICON.refresh)}Reiniciar</button>
                        </div>
                    </div>
                    <div id="svAlerta"></div>
                    <div class="flex gap-6 flex-wrap pt-3 border-t border-slate-400/15 text-[13px]">
                        <label class="flex items-center gap-2.5 cursor-pointer select-none">
                            <input type="checkbox" id="optAutostart" class="w-4 h-4 accent-accent cursor-pointer"> Iniciar junto com o celular
                        </label>
                        <label class="flex items-center gap-2.5 cursor-pointer select-none">
                            <input type="checkbox" id="optAutorestart" class="w-4 h-4 accent-accent cursor-pointer"> Reiniciar automaticamente se cair
                        </label>
                        <span class="text-[11.5px] text-muted self-center" id="optNota"></span>
                    </div>
                </section>

                <section class="card card-static p-5 flex flex-col gap-3">
                    <h2 class="text-[15px] font-bold">Token</h2>
                    <p class="text-[12.5px] text-muted">Fica só no celular (<code>~/.config/droidserver/tunnel.env</code>, legível só pelo Termux) e nunca volta ao painel. Atual: <code class="text-slate-300" id="tnFim">—</code></p>
                    <form id="tunnelForm" class="flex gap-3 items-end flex-wrap">
                        <input class="input font-mono flex-1 min-w-[260px]" type="password" id="tunnelToken" autocomplete="off" spellcheck="false"
                            aria-label="Novo token do tunnel" placeholder="Novo token (ou o comando com --token)">
                        <button type="submit" class="btn btn-primary">${svg(ICON.refresh)}Trocar token</button>
                        <button type="button" id="btnRemoverTunnel" class="btn btn-danger">${svg(ICON.trash)}Remover tunnel</button>
                    </form>
                </section>

                ${htmlLogs('Logs do cloudflared', { altura: 'h-[420px]' })}
            </div>`;

            // ---- Comandos (mesmo canal da aba Serviço) ----
            const pendentes = new Map();
            function comando(acao, dados = {}) {
                return new Promise((resolve) => {
                    const req = ++reqSeq;
                    const timer = setTimeout(() => { pendentes.delete(req); resolve({ ok: false, msg: 'O node não respondeu (está online?).' }); }, 30000);
                    pendentes.set(req, (r) => { clearTimeout(timer); resolve(r); });
                    socket.emit('servico', { ip, alias, acao, dados, req });
                });
            }
            const onResposta = (r) => {
                const fn = pendentes.get(r.req);
                if (!fn) return;
                pendentes.delete(r.req);
                if (r.servico) mostrarEstado(r.servico, null);
                fn(r);
            };
            socket.on('servico_resposta', onResposta);

            // ---- Estado ----
            const TOM_DOT = { ok: 'dot-online', warn: 'dot-idle', bad: 'dot-offline', muted: 'dot-idle' };
            const TOM_TXT = { ok: 'text-ok', warn: 'text-warn', bad: 'text-bad', muted: 'text-muted' };
            let ultimo = null;
            function mostrarEstado(tn, n) {
                ultimo = tn;
                const tarefa = n && [n.tarefa_atual, ...(n.tarefas_pendentes || [])].find(ehTarefaTunnel);
                const e = tarefa ? { tone: 'warn', label: textoTarefa(tarefa.acao, 0) + '…' }
                    : (!tn.configurado ? { tone: 'muted', label: 'Não configurado' } : estadoServico(tn));
                $('svDot').className = 'dot ' + TOM_DOT[e.tone];
                $('svEstado').className = 'text-[16px] font-bold ' + TOM_TXT[e.tone];
                $('svEstado').textContent = e.label;
                const partes = [];
                if (tn.pid) partes.push(`pid ${tn.pid}`);
                if (tn.uptime) partes.push(`no ar há ${tn.uptime}`);
                if (tn.versao) partes.push(`cloudflared ${tn.versao}`);
                $('svInfo').textContent = partes.join(' · ') || '—';
                $('tnFim').textContent = tn.token_fim ? '…' + tn.token_fim : 'nenhum';

                const rodando = ['RUNNING', 'STARTING', 'BACKOFF'].includes(tn.estado);
                document.querySelector('[data-acao="iniciar"]').disabled = rodando || !tn.configurado;
                document.querySelector('[data-acao="parar"]').disabled = !rodando;
                document.querySelector('[data-acao="reiniciar"]').disabled = !tn.configurado;

                let alerta = '';
                if (n && vigia.atualizar(n)) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-warn/30 bg-warn/10 text-[13px]">O node não confirmou o token novo (a tarefa pode ter se perdido). Envie de novo.</div>`;
                } else if (!tn.configurado && !tarefa) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-accent2/30 bg-accent2/10 text-[13px]"><strong>Nenhum tunnel configurado neste node.</strong> Cole o token abaixo.</div>`;
                } else if (['FATAL', 'BACKOFF'].includes(tn.estado)) {
                    alerta = `<div class="px-3.5 py-3 rounded-xl border border-bad/30 bg-bad/10 text-[13px]"><strong>O cloudflared não fica de pé.</strong> Veja os logs: token revogado, sem internet ou relógio do celular errado são as causas comuns.
                        ${tn.detalhe ? `<div class="mt-1 text-muted">Supervisor: ${esc(tn.detalhe)}</div>` : ''}</div>`;
                }
                $('svAlerta').innerHTML = alerta;
                if (document.activeElement !== $('optAutostart')) $('optAutostart').checked = tn.autostart !== false;
                if (document.activeElement !== $('optAutorestart')) $('optAutorestart').checked = tn.autorestart !== false;
            }

            async function carregarEstado() {
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}`);
                    if (!res.ok) { $('svEstado').textContent = 'Node não encontrado ou offline'; return; }
                    const n = await res.json();
                    mostrarEstado(n.tunnel || { configurado: false }, n);
                } catch (e) { }
            }

            document.querySelectorAll('[data-acao]').forEach(b => b.addEventListener('click', async () => {
                b.disabled = true;
                const r = await comando(b.dataset.acao);
                toast(r.msg || (r.ok ? 'Feito' : 'Falhou'));
                b.disabled = false;
                if (ultimo) mostrarEstado(ultimo, null);
            }));

            async function configurar(chave, valor) {
                const r = await comando('configurar', { [chave]: valor });
                toast(r.ok ? 'Configuração salva' : (r.msg || 'Falhou'));
                $('optNota').textContent = r.ok ? 'Vale a partir da próxima reinicialização do tunnel.' : '';
            }
            $('optAutostart').addEventListener('change', (e) => configurar('autostart', e.target.checked));
            $('optAutorestart').addEventListener('change', (e) => configurar('autorestart', e.target.checked));

            $('tunnelForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (await enviarTokenTunnel(ip, $('tunnelToken').value, vigia)) { $('tunnelToken').value = ''; carregarEstado(); }
            });
            $('btnRemoverTunnel').addEventListener('click', async () => {
                if (!confirm('Remover o tunnel deste node? O cloudflared para, e o token e os logs são apagados do celular.')) return;
                try {
                    const resp = await fetch(`/node/${encodeURIComponent(ip)}/tunnel/delete`, { method: 'POST' });
                    const r = await resp.json().catch(() => ({}));
                    toast(resp.ok ? 'Remoção enfileirada' : (r.erro || 'Falhou'));
                } catch (err) { toast('Falha ao enviar'); }
                carregarEstado();
            });

            // ---- Logs ao vivo ----
            const logs = painelLogs(ip, alias, {
                vazio: 'Sem saída ainda. O que o cloudflared imprimir aparece aqui.',
                arquivo: () => 'tunnel',
                aoReconectar: () => carregarEstado(),
            });

            carregarEstado();
            const onUpd = (data) => { if (data && data.ip === ip) carregarEstado(); };
            socket.on('node_updated', onUpd);
            const timer = setInterval(carregarEstado, 10000);
            cleanup = () => {
                clearInterval(timer);
                logs.parar();
                socket.off('servico_resposta', onResposta);
                socket.off('node_updated', onUpd);
                pendentes.forEach(fn => fn({ ok: false, msg: 'cancelado' }));
            };
        }

        // =====================================================================
        // VIEW: Monitor do node  (/node/<ip>/monitor)
        //   GET  /api/node/<ip>/estatisticas?janela=<s>  -> registro do celular
        //   POST /api/node/<ip>/armazenamento/recalcular
        //   GET  /api/node/<ip>                          -> CPU/RAM atuais por worker
        //   logs gerais: logs_assinar com "@agente" ou "@supervisord"
        // =====================================================================
        // "Ao vivo": últimos 2 min, 1 amostra/s enviada pelo node enquanto a aba está aberta
        const AO_VIVO = 120, AO_VIVO_BUFFER_S = 300;
        const JANELAS = [[AO_VIVO, 'Ao vivo'], [3600, '1 h'], [6 * 3600, '6 h'], [86400, '24 h'], [7 * 86400, '7 d']];
        const SERIES_MEM = [
            { chave: 'agente_mb', nome: 'Agente', cor: '#4ea8de' },
            { chave: 'supervisord_mb', nome: 'Supervisord', cor: '#fbbf24' },
        ];
        const LOGS_NODE = [['@agente', 'Agente (node.log)'], ['@supervisord', 'Supervisord']];
        let janelaMonitor = AO_VIVO, logMonitor = '@agente';  // lembrados entre visitas

        function fmtDuracao(s) {
            if (s == null) return '—';
            const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
            return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
        }

        function viewMonitor(ip) {
            setNav(ip);
            setFooter(`<div class="flex items-center gap-2"><span class="dot dot-online !w-[9px] !h-[9px]"></span>Estatísticas do registro do celular</div>`);
            const segmento = (attr, valor, texto, ativo) => `<button type="button" ${attr}="${esc(valor)}" aria-pressed="${ativo}"
                class="px-3 py-1.5 rounded-lg text-[12px] font-semibold transition ${ativo ? 'bg-accent/20 text-white shadow-[inset_0_-2px_0_#e94560]' : 'text-muted hover:text-slate-200 hover:bg-slate-400/10'}">${texto}</button>`;
            const grupo = (attr, opcoes, atual, rotulo) => `<div role="group" aria-label="${rotulo}" class="flex gap-1 p-1 rounded-xl bg-slate-950/45 border border-slate-400/15">
                ${opcoes.map(([v, t]) => segmento(attr, v, t, v === atual)).join('')}</div>`;
            const legenda = (series) => `<div class="flex gap-4 flex-wrap">${series.map(s => `
                <span class="flex items-center gap-1.5 text-[11.5px] text-muted"><span class="inline-block w-3 h-[3px] rounded-full" style="background:${s.cor}"></span>${s.nome}</span>`).join('')}</div>`;

            $('view').innerHTML = `
            <div class="max-w-[1400px] px-5 md:px-10 pt-6 md:pt-9 pb-14 flex flex-col gap-6">
                <header class="flex items-end justify-between gap-4 flex-wrap">
                    <div>
                        <h1 class="section-title text-[26px] tracking-tight">Node <span class="text-accent2">${esc(ip)}</span></h1>
                        <p class="mt-1.5 text-[13.5px] text-muted" id="monSub">Carregando…</p>
                        <div class="mt-3">${abasNode(ip, 'monitor')}</div>
                    </div>
                    <a href="/" data-link class="btn btn-ghost">${svg(ICON.back)}Voltar ao Dashboard</a>
                </header>

                <div id="monAviso" class="hidden px-3.5 py-3 rounded-xl border border-accent2/30 bg-accent2/10 text-[13px]"></div>

                <section class="card card-static p-5 flex flex-col gap-4" aria-labelledby="monTitUso">
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                        <div>
                            <h2 class="text-[15px] font-bold" id="monTitUso">Uso do node</h2>
                            <p class="text-[11.5px] text-muted mt-0.5" id="monCobertura">—</p>
                        </div>
                        <div id="monJanelas">${grupo('data-janela', JANELAS, janelaMonitor, 'Período')}</div>
                    </div>
                    <div class="grid gap-5 lg:grid-cols-2">
                        <div class="flex flex-col gap-2">
                            <div class="flex items-center justify-between gap-2"><span class="label-xs">CPU e RAM · % do aparelho</span>${legenda(SERIES)}</div>
                            <div class="relative" id="monGrafCpu"><div class="h-[150px] grid place-items-center text-[12px] text-muted">Carregando…</div></div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <div class="flex items-center justify-between gap-2"><span class="label-xs">Memória do DroidServer · MB</span>${legenda(SERIES_MEM)}</div>
                            <div class="relative" id="monGrafMem"><div class="h-[150px] grid place-items-center text-[12px] text-muted">Carregando…</div></div>
                        </div>
                    </div>
                    <dl class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 pt-4 border-t border-slate-400/15" id="monAparelho"></dl>
                </section>

                <section class="card card-static p-5 flex flex-col gap-3" aria-labelledby="monTitServ">
                    <div>
                        <h2 class="text-[15px] font-bold" id="monTitServ">Serviços no período</h2>
                        <p class="text-[11.5px] text-muted mt-0.5">“Rodando” conta as amostras em que o Supervisor dizia RUNNING; “HTTP ok” só vale para serviços web com porta declarada.</p>
                    </div>
                    <div class="overflow-x-auto" id="monServicos"><p class="text-[12.5px] text-muted">Carregando…</p></div>
                </section>

                <section class="card card-static p-5 flex flex-col gap-4" aria-labelledby="monTitArm">
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                        <div>
                            <h2 class="text-[15px] font-bold" id="monTitArm">Armazenamento</h2>
                            <p class="text-[11.5px] text-muted mt-0.5" id="monMedido">—</p>
                        </div>
                        <button type="button" class="btn btn-ghost" id="btnRecalcular">${svg(ICON.refresh)}Recalcular</button>
                    </div>
                    <div id="monDisco"></div>
                    <div class="overflow-x-auto" id="monArmaz"></div>
                </section>

                ${htmlLogs('Logs do node', { altura: 'h-[420px]', extra: `<div id="monLogs">${grupo('data-log', LOGS_NODE, logMonitor, 'Qual log')}</div>` })}
            </div>`;

            let node = null, est = null, carregando = null, timerMedindo = null;
            const vivo = [];          // amostras de 1 s recebidas desde que a aba abriu
            let timerSemVivo = null;  // avisa se as amostras ao vivo pararem de chegar

            // ---- Estado atual do node (CPU/RAM por worker, online/offline) ----
            async function carregarNode() {
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}`);
                    if (res.status === 404) { $('monSub').textContent = 'Node não encontrado no host.'; return; }
                    if (!res.ok) return;
                    node = await res.json();
                    $('monSub').textContent = (isOnline(node) ? 'Online' : 'Offline') + ' · último contato ' + (node.last_seen || '—') + (node.modelo ? ` · ${node.modelo}` : '');
                    desenharServicos(); desenharArmazenamento();
                } catch (_) { }
            }

            // ---- Estatísticas do registro (no celular) ----
            async function carregarStats() {
                const janela = janelaMonitor;
                const pedido = fetch(`/api/node/${encodeURIComponent(ip)}/estatisticas?janela=${janela === AO_VIVO ? 3600 : janela}`)
                    .then(async r => ({ r, d: await r.json().catch(() => ({})) }));
                carregando = pedido;
                let r, d;
                try { ({ r, d } = await pedido); } catch (_) { r = null; d = {}; }
                if (carregando !== pedido || janela !== janelaMonitor) return;  // outra janela foi pedida
                if (!r || !r.ok) {
                    await semEstatisticas(d.erro || 'O node não respondeu.');
                    return;
                }
                $('monAviso').classList.add('hidden');
                est = d;
                desenharUso(); desenharServicos(); desenharArmazenamento();
                clearTimeout(timerMedindo);
                if (est.armazenamento && est.armazenamento.medindo) timerMedindo = setTimeout(carregarStats, 3000);
            }

            // Node offline (ou sem pareamento): mostra o que o painel guardou
            async function semEstatisticas(erro) {
                $('monAviso').classList.remove('hidden');
                $('monAviso').innerHTML = `<strong>Sem estatísticas do celular agora:</strong> ${esc(erro)} O gráfico abaixo mostra o que o painel guardou (até 30 min); o resto volta quando o node responder.`;
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}/historico`);
                    const amostras = res.ok ? (await res.json()).amostras : [];
                    if (janelaMonitor === AO_VIVO) return;  // o ao vivo tem o próprio aviso
                    desenharGrafico(ip, amostras, { area: $('monGrafCpu'), janela: 1800, rotulo: '−30 min' });
                } catch (_) { }
                $('monGrafMem').innerHTML = '<div class="h-[150px] grid place-items-center text-[12px] text-muted">Indisponível com o node fora do ar.</div>';
                $('monCobertura').textContent = 'Histórico do painel';
            }

            function desenharUso() {
                if (janelaMonitor === AO_VIVO) desenharVivo();
                else {
                const rot = '−' + (JANELAS.find(([v]) => v === est.janela_s)?.[1] || fmtDuracao(est.janela_s));
                desenharGrafico(ip, est.serie, { area: $('monGrafCpu'), janela: est.janela_s, rotulo: rot });
                desenharGrafico(ip, est.serie, { area: $('monGrafMem'), janela: est.janela_s, rotulo: rot, series: SERIES_MEM, unidade: 'MB', teto: null });
                const desde = est.primeira ? new Date(est.primeira * 1000).toLocaleString('pt-BR') : null;
                $('monCobertura').textContent = est.amostras_total
                    ? `${est.amostras_total} amostras · registro cobre ${est.cobertura_pct}% do período${est.cobertura_pct < 95 && desde ? ` (desde ${desde})` : ''}`
                    : 'Nenhuma amostra gravada neste período.';
                }
                const a = est.aparelho || {}, ag = est.agente || {};
                const item = (rotulo, valor) => `<div><dt class="label-xs">${rotulo}</dt><dd class="text-[13px] font-semibold mt-1 truncate" title="${esc(valor)}">${esc(valor)}</dd></div>`;
                $('monAparelho').innerHTML = item('Aparelho', a.modelo || '—') + item('Android', a.android || '—')
                    + item('Núcleos', a.nucleos ?? '—') + item('Ligado há', fmtDuracao(a.uptime_s))
                    + item('Agente rodando há', fmtDuracao(ag.uptime_s)) + item('PID do agente', ag.pid ?? '—');
            }

            // ---- Ao vivo: 1 amostra/s do node enquanto esta aba está aberta ----
            const SEM_VIVO = 'Aguardando o node — as amostras ao vivo chegam a cada 1 s.';
            function desenharVivo() {
                const opc = { janela: AO_VIVO, rotulo: '−2 min', vazio: SEM_VIVO };
                desenharGrafico(ip, vivo, { ...opc, area: $('monGrafCpu') });
                desenharGrafico(ip, vivo, { ...opc, area: $('monGrafMem'), series: SERIES_MEM, unidade: 'MB', teto: null });
                const ult = vivo[vivo.length - 1];
                $('monCobertura').textContent = ult
                    ? `Ao vivo · 1 amostra por segundo · última às ${new Date(ult.t * 1000).toLocaleTimeString('pt-BR')} · tabelas: última 1 h`
                    : 'Ao vivo · aguardando o node…';
            }
            function semVivo() {
                if (janelaMonitor === AO_VIVO) $('monCobertura').textContent =
                    'Ao vivo · sem amostras há alguns segundos (node desconectado do WebSocket ou agente desatualizado).';
            }
            const onVivo = (a) => {
                if (!a || a.ip !== ip || typeof a.t !== 'number') return;
                vivo.push(a);
                while (vivo.length && vivo[0].t < a.t - AO_VIVO_BUFFER_S) vivo.shift();
                clearTimeout(timerSemVivo);
                timerSemVivo = setTimeout(semVivo, 5000);
                // "CPU agora" / "RAM agora" da tabela de armazenamento seguem o ao vivo
                if (node) {
                    node.cpu_workers = { ...(node.cpu_workers || {}), ...(a.cpu_workers || {}) };
                    for (const [w, mb] of Object.entries(a.ram_workers || {})) {
                        if (node.servicos && node.servicos[w]) node.servicos[w].ram_mb = mb;
                    }
                    desenharArmazenamento();
                }
                if (janelaMonitor === AO_VIVO) { $('monAviso').classList.add('hidden'); desenharVivo(); }
            };
            const assinarVivo = () => socket.emit('aovivo_assinar', { ip });

            function desenharServicos() {
                if (!est && !node) return;
                const sv = (est && est.servicos) || {}, falhas = (est && est.falhas) || {};
                const nomes = [...new Set([...Object.keys(sv), ...((node && node.workers) || [])])].sort();
                if (!nomes.length) { $('monServicos').innerHTML = '<p class="text-[12.5px] text-muted">Nenhum worker neste node.</p>'; return; }
                const barra = (pct) => pct == null ? '<span class="text-muted">—</span>' : `
                    <div class="flex items-center gap-2 min-w-[130px]"><div class="flex-1 h-1.5 rounded-full bg-slate-950/45 border border-slate-400/15 overflow-hidden">
                    <div class="h-full rounded-full ${pct >= 99 ? 'bg-ok' : pct >= 90 ? 'bg-warn' : 'bg-bad'}" style="width:${pct}%"></div></div><span class="text-[12px] font-semibold w-12 text-right">${pct}%</span></div>`;
                const linhas = nomes.map(alias => {
                    const s = sv[alias] || {}, f = falhas[alias] || {};
                    const atual = estadoServico((node && node.servicos || {})[alias], (node && node.worker_status || {})[alias] || s.ultimo_estado);
                    const ult = f.ultima_falha;
                    return `<tr class="border-t border-slate-400/10">
                        <td class="py-2.5 pr-4"><a class="font-semibold hover:text-accent2" data-link href="/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}">${esc(alias)}</a></td>
                        <td class="py-2.5 pr-4"><span class="pill ${TOM_PILL[atual.tone]}">${esc(atual.label)}</span></td>
                        <td class="py-2.5 pr-4">${barra(s.rodando_pct ?? null)}</td>
                        <td class="py-2.5 pr-4">${s.http_ok_pct != null ? fmtPct(s.http_ok_pct) : '<span class="text-muted">—</span>'}</td>
                        <td class="py-2.5 pr-4 ${f.falhas_hoje ? 'text-bad font-semibold' : 'text-muted'}" title="${ult ? esc('Última às ' + (ult.quando || '?') + ': ' + (ult.motivo || '')) : ''}">${f.falhas_hoje ?? '—'}</td>
                        <td class="py-2.5 pr-4">${fmtPct(s.cpu_media ?? null)}</td>
                        <td class="py-2.5">${s.ram_mb_media != null ? s.ram_mb_media + ' MB' : '—'}</td>
                    </tr>`;
                }).join('');
                $('monServicos').innerHTML = `<table class="w-full text-left text-[13px]">
                    <thead><tr class="text-[11px] uppercase tracking-wider text-muted">
                        <th class="pb-2 pr-4 font-semibold">Worker</th><th class="pb-2 pr-4 font-semibold">Agora</th><th class="pb-2 pr-4 font-semibold">Rodando no período</th>
                        <th class="pb-2 pr-4 font-semibold">HTTP ok</th><th class="pb-2 pr-4 font-semibold">Falhas hoje</th><th class="pb-2 pr-4 font-semibold">CPU média</th><th class="pb-2 font-semibold">RAM média</th>
                    </tr></thead><tbody>${linhas}</tbody></table>`;
            }

            function desenharArmazenamento() {
                if (!est || !est.armazenamento) {
                    $('monDisco').innerHTML = '';
                    $('monArmaz').innerHTML = `<p class="text-[12.5px] text-muted">${est ? 'Este agente não informa o armazenamento — atualize o node.' : 'Carregando…'}</p>`;
                    return;
                }
                const arm = est.armazenamento, d = arm.disco;
                const workers = arm.workers || {};
                const ds = arm.workers_total != null ? arm.workers_total + (arm.droidserver || 0) : null;
                if (d && d.total) {
                    const pDs = ds != null ? Math.min(100, ds / d.total * 100) : 0;
                    const pOut = Math.max(0, d.usado / d.total * 100 - pDs);
                    const seg = (cor, nome, valor, pct) => `<span class="flex items-center gap-1.5"><span class="inline-block w-2.5 h-2.5 rounded-sm ${cor}"></span>${nome}: <strong class="text-slate-200">${fmtBytes(valor)}</strong>${pct != null ? ` (${pct.toFixed(1)}%)` : ''}</span>`;
                    $('monDisco').innerHTML = `
                        <div class="flex justify-between items-center mb-1.5"><span class="label-xs tracking-[.09em]">Armazenamento interno do aparelho</span>
                            <span class="text-xs font-bold">${fmtBytes(d.usado)} de ${fmtBytes(d.total)} usados</span></div>
                        <div class="flex h-2.5 rounded-full bg-slate-950/45 border border-slate-400/15 overflow-hidden" role="img"
                             aria-label="DroidServer ${fmtBytes(ds)}, outros ${fmtBytes(d.usado - (ds || 0))}, livre ${fmtBytes(d.livre)}">
                            <div class="h-full bg-accent" style="width:${pDs}%"></div><div class="h-full bg-slate-400/40" style="width:${pOut}%"></div>
                        </div>
                        <div class="flex gap-4 flex-wrap mt-2 text-[11.5px] text-muted">
                            ${seg('bg-accent', 'DroidServer + workers', ds, ds != null ? ds / d.total * 100 : null)}
                            ${seg('bg-slate-400/40', 'Outros apps e sistema', Math.max(0, d.usado - (ds || 0)), null)}
                            ${seg('bg-slate-950 border border-slate-400/30', 'Livre', d.livre, 100 - d.percent)}
                        </div>`;
                } else $('monDisco').innerHTML = '';

                const nomes = [...new Set([...Object.keys(workers), ...((node && node.workers) || [])])];
                const total = (a) => (workers[a] || {}).total ?? -1;
                nomes.sort((a, b) => total(b) - total(a) || a.localeCompare(b));
                const maior = Math.max(1, ...nomes.map(total), arm.droidserver || 0);
                const cpuW = (node && node.cpu_workers) || {}, svs = (node && node.servicos) || {};
                const pendente = arm.medindo ? '<span class="text-muted">medindo…</span>' : '<span class="text-muted">—</span>';
                const linha = (nome, tipo, w, cpu, ram, link) => `<tr class="border-t border-slate-400/10">
                    <td class="py-2.5 pr-4">${link ? `<a class="font-semibold hover:text-accent2" data-link href="${link}">${esc(nome)}</a>` : `<span class="font-semibold">${esc(nome)}</span>`}
                        ${tipo ? `<span class="chip !px-2 !py-0.5 ml-1.5">${tipo}</span>` : ''}</td>
                    <td class="py-2.5 pr-4">${w && w.dados != null ? fmtBytes(w.dados) : pendente}</td>
                    <td class="py-2.5 pr-4">${w && w.logs != null ? fmtBytes(w.logs) : pendente}</td>
                    <td class="py-2.5 pr-4"><div class="flex items-center gap-2 min-w-[150px]">
                        <div class="flex-1 h-1.5 rounded-full bg-slate-950/45 border border-slate-400/15 overflow-hidden"><div class="h-full rounded-full bg-accent" style="width:${w ? Math.max(1, w.total / maior * 100) : 0}%"></div></div>
                        <span class="text-[12px] font-semibold w-[72px] text-right">${w ? fmtBytes(w.total) : '—'}</span></div></td>
                    <td class="py-2.5 pr-4">${fmtPct(cpu ?? null)}</td>
                    <td class="py-2.5">${ram != null ? ram + ' MB' : '—'}</td>
                </tr>`;
                const linhas = nomes.map(a => {
                    const w = workers[a];
                    const tipo = w ? (w.tipo === 'postgres' ? 'PostgreSQL' : 'Linux') : ((svs[a] || {}).tipo === 'postgres' ? 'PostgreSQL' : '');
                    return linha(a, tipo, w, cpuW[a], (svs[a] || {}).ram_mb, `/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(a)}`);
                }).join('') + (arm.droidserver != null
                    ? linha('DroidServer', 'agente', { dados: arm.droidserver, logs: null, total: arm.droidserver }, null, null, null).replace(pendente, '<span class="text-muted">—</span>')
                    : '');
                $('monArmaz').innerHTML = `<table class="w-full text-left text-[13px]">
                    <thead><tr class="text-[11px] uppercase tracking-wider text-muted">
                        <th class="pb-2 pr-4 font-semibold">Worker</th><th class="pb-2 pr-4 font-semibold" title="rootfs do container ou pasta de dados do PostgreSQL">Disco</th>
                        <th class="pb-2 pr-4 font-semibold">Logs</th><th class="pb-2 pr-4 font-semibold">Total</th>
                        <th class="pb-2 pr-4 font-semibold">CPU agora</th><th class="pb-2 font-semibold">RAM agora</th>
                    </tr></thead><tbody>${linhas}</tbody></table>`;

                const quando = arm.medido_em ? `medido há ${fmtDuracao(Math.max(0, Date.now() / 1000 - arm.medido_em))}${arm.duracao_s != null ? ` (levou ${arm.duracao_s} s)` : ''}` : 'ainda não medido';
                $('monMedido').textContent = arm.medindo ? 'Medindo o espaço dos workers…' : `Espaço por worker ${quando}; o node refaz a medição a cada 10 min.`;
                $('btnRecalcular').disabled = !!arm.medindo;
            }

            // ---- Controles ----
            $('monJanelas').addEventListener('click', (e) => {
                const b = e.target.closest('[data-janela]');
                if (!b || +b.dataset.janela === janelaMonitor) return;
                janelaMonitor = +b.dataset.janela;
                $('monJanelas').innerHTML = grupo('data-janela', JANELAS, janelaMonitor, 'Período');
                $('monGrafCpu').innerHTML = $('monGrafMem').innerHTML = '<div class="h-[150px] grid place-items-center text-[12px] text-muted">Carregando…</div>';
                if (janelaMonitor === AO_VIVO) desenharVivo();
                carregarStats();
            });
            $('btnRecalcular').addEventListener('click', async () => {
                $('btnRecalcular').disabled = true;
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}/armazenamento/recalcular`, { method: 'POST' });
                    if (!res.ok) { toast((await res.json().catch(() => ({}))).erro || 'Falha ao pedir a medição.'); $('btnRecalcular').disabled = false; return; }
                    $('monMedido').textContent = 'Medindo o espaço dos workers…';
                    setTimeout(carregarStats, 1500);
                } catch (_) { $('btnRecalcular').disabled = false; }
            });

            const logs = painelLogs(ip, logMonitor, {
                vazio: 'Sem linhas ainda neste log.',
                arquivo: (a) => `node-${ip}-${a.slice(1)}`,
            });
            $('monLogs').addEventListener('click', (e) => {
                const b = e.target.closest('[data-log]');
                if (!b || b.dataset.log === logMonitor) return;
                logMonitor = b.dataset.log;
                $('monLogs').innerHTML = grupo('data-log', LOGS_NODE, logMonitor, 'Qual log');
                logs.trocar(logMonitor);
            });

            // ---- Ciclo de vida da view ----
            carregarNode(); carregarStats();
            let ultimoNode = 0;
            const onUpd = (data) => {
                if (!data || data.ip !== ip) return;
                // A assinatura se perde se a aba abriu antes de o node aparecer no
                // host (ou se ele reconectou): sem amostra recente, assina de novo
                const ult = vivo[vivo.length - 1];
                if (!ult || Date.now() / 1000 - ult.t > 5) assinarVivo();
                if (Date.now() - ultimoNode < 5000) return;
                ultimoNode = Date.now();
                carregarNode();
            };
            socket.on('node_updated', onUpd);
            socket.on('aovivo_saida', onVivo);
            socket.on('connect', assinarVivo);  // reconectou: a sala foi perdida
            assinarVivo();
            if (janelaMonitor === AO_VIVO) desenharVivo();
            timerSemVivo = setTimeout(semVivo, 8000);
            const timer = setInterval(carregarStats, 30000);
            cleanup = () => {
                socket.emit('aovivo_cancelar', { ip });
                socket.off('aovivo_saida', onVivo);
                socket.off('connect', assinarVivo);
                clearTimeout(timerSemVivo);
                clearInterval(timer);
                clearTimeout(timerMedindo);
                logs.parar();
                socket.off('node_updated', onUpd);
            };
        }

        function viewTerminal(ip, alias) {
            setNav(ip);
            setFooter(`<div class="flex items-center gap-2"><span class="dot dot-online !w-[9px] !h-[9px]"></span>Sessão ao vivo</div>`);

            const view = $('view');
            view.classList.remove('md:overflow-y-auto');
            view.classList.add('md:overflow-hidden');

            view.innerHTML = `
            <div class="h-[calc(100vh-72px)] md:h-full flex flex-col p-5 box-border min-w-0">
                <header class="flex items-end justify-between gap-4 flex-wrap mb-3.5 shrink-0">
                    <div>
                        <h1 class="section-title text-[26px] tracking-tight flex items-center gap-2.5">
                            Worker <span class="chip">${esc(alias)}</span>
                        </h1>
                        <p class="mt-1 text-[13.5px] text-muted">Node ${esc(ip)} — sessão interativa via WebSocket.</p>
                        <div class="mt-3">${abasWorker(ip, alias, 'terminal')}</div>
                    </div>
                    <div class="flex items-center gap-3.5">
                        <span class="flex items-center gap-2 text-[12.5px] font-semibold">
                            <span class="dot dot-idle" id="statusDot"></span>
                            <span id="status" class="text-warn">Conectando...</span>
                        </span>
                        <a href="/node/${esc(ip)}" data-link class="btn btn-ghost">${svg(ICON.back)}Voltar ao node</a>
                    </div>
                </header>

                <div class="flex items-center justify-between gap-3 flex-wrap mb-3 px-3 py-2.5 bg-surface border border-slate-400/15 rounded-xl shrink-0">
                    <div class="flex gap-2 flex-wrap items-center">
                        <button class="btn btn-dark" id="btnCopy" title="Copiar o texto selecionado no terminal" disabled>${svg(ICON.copy)}Copiar</button>
                        <button class="btn btn-dark" id="btnPaste" title="Colar texto no terminal">${svg(ICON.paste)}Colar</button>
                        <button class="btn btn-dark" id="btnClear" title="Limpar a tela">${svg(ICON.eraser)}Limpar</button>
                    </div>
                    <div class="flex gap-2 flex-wrap items-center">
                        <button class="btn btn-ghost" id="btnReconnect" title="Reconectar o WebSocket">${svg(ICON.refresh)}Reconectar</button>
                        <button class="btn btn-ghost" id="btnFullscreen" title="Tela cheia (ESC para sair)">${svg(ICON.full)}Tela cheia</button>
                    </div>
                </div>

                <div class="flex-1 min-h-0 relative mb-2.5">
                    <div id="termShell" class="absolute inset-0 bg-term border border-slate-400/15 rounded-xl overflow-hidden shadow-card"></div>
                </div>

                <div class="text-[11.5px] text-muted text-center shrink-0">
                    Clique no terminal para digitar · selecione um trecho e use Copiar · use Colar para enviar texto
                </div>
            </div>
            <div id="clipFundo" class="fixed inset-0 z-50 bg-black/50 items-center justify-center p-4 hidden">
              <div id="clipModal" role="dialog" aria-modal="true" aria-labelledby="clipTitulo"
                class="w-full max-w-[560px] bg-surface border border-slate-400/15 rounded-xl shadow-card p-5">
                <h2 id="clipTitulo" class="text-[15px] font-bold text-white mb-1"></h2>
                <p id="clipDica" class="text-[12.5px] text-muted mb-3"></p>
                <textarea id="clipTexto" rows="7" spellcheck="false" autocomplete="off" autocapitalize="off"
                    class="w-full px-3 py-2 rounded-lg bg-term border border-slate-400/15 font-mono text-[12.5px] text-slate-200 outline-none focus:border-accent/60 resize-y"></textarea>
                <div class="flex justify-end gap-2 mt-3">
                    <button type="button" class="btn btn-ghost" id="clipCancelar">Fechar</button>
                    <button type="button" class="btn btn-primary" id="clipOk"></button>
                </div>
              </div>
            </div>`;

            const term = new Terminal({
                cursorBlink: true,
                fontSize: 14,
                scrollback: 5000,
                fontFamily: '"JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace',
                theme: {
                    background: '#12121f', foreground: '#f0f0f0', cursor: '#e94560', cursorAccent: '#12121f',
                    selectionBackground: 'rgba(233,69,96,0.35)',
                    black: '#12121f', red: '#f87171', green: '#34d399', yellow: '#fbbf24',
                    blue: '#818cf8', magenta: '#c084fc', cyan: '#67e8f9', white: '#f0f0f0',
                    brightBlack: '#64748b', brightRed: '#fb7185', brightGreen: '#6ee7b7', brightYellow: '#fcd34d',
                    brightBlue: '#a5b4fc', brightMagenta: '#d8b4fe', brightCyan: '#a5f3fc', brightWhite: '#f8fafc'
                }
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open($('termShell'));
            fitAddon.fit();
            term.focus();
            term.write('\x1b[38;5;111mDroidServer\x1b[0m — Iniciando conexão com o host...\r\n\r\n');

            // ---- Status ----
            const statusEl = $('status'), statusDot = $('statusDot');
            const STATUS_COLOR = { '#34d399': 'text-ok', '#f87171': 'text-bad', '#fbbf24': 'text-warn' };
            function setStatus(texto, cor, classe) {
                statusEl.innerText = texto;
                statusEl.className = STATUS_COLOR[cor] || '';
                statusDot.className = 'dot dot-' + classe;
            }

            // ---- Copiar / Colar (só pelos botões) ----
            // O painel costuma ser aberto por HTTP na LAN (http://IP:5050). Fora de
            // contexto seguro (HTTPS/localhost) o navegador não expõe
            // navigator.clipboard, então cada botão tem um caminho alternativo:
            // copiar via execCommand e, se falhar, uma janela com o texto já
            // selecionado; colar por uma janela onde o usuário cola e envia.
            const clipboardApi = window.isSecureContext && navigator.clipboard ? navigator.clipboard : null;

            let clipAcao = null;
            function abrirClip({ titulo, dica, texto = '', ok, somenteLeitura, acao }) {
                $('clipTitulo').innerText = titulo;
                $('clipDica').innerText = dica;
                $('clipOk').innerText = ok;
                const ta = $('clipTexto');
                ta.value = texto;
                ta.readOnly = !!somenteLeitura;
                clipAcao = acao;
                $('clipFundo').classList.replace('hidden', 'flex');
                ta.focus();
                if (somenteLeitura) ta.select();
            }
            function fecharClip() {
                $('clipFundo').classList.replace('flex', 'hidden');
                $('clipTexto').value = '';
                clipAcao = null;
                term.focus();
            }
            $('clipCancelar').addEventListener('click', fecharClip);
            $('clipFundo').addEventListener('click', (e) => { if (e.target === e.currentTarget) fecharClip(); });
            $('clipOk').addEventListener('click', () => { if (clipAcao) clipAcao($('clipTexto').value); });
            $('clipModal').addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { e.preventDefault(); fecharClip(); }
                else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && clipAcao) {
                    e.preventDefault(); clipAcao($('clipTexto').value);
                }
            });

            // Copiar: guarda a última seleção, pois o clique no botão pode
            // desfazer a seleção do xterm antes do handler rodar.
            const btnCopy = $('btnCopy');
            let ultimaSelecao = '';
            term.onSelectionChange(() => {
                if (term.hasSelection()) ultimaSelecao = term.getSelection();
                btnCopy.disabled = !term.hasSelection() && !ultimaSelecao;
            });
            function copiarExecCommand(texto) {
                const ta = document.createElement('textarea');
                ta.value = texto;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, texto.length);
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                document.body.removeChild(ta);
                return ok;
            }
            function copiado() {
                toast('Copiado!');
                ultimaSelecao = '';
                term.clearSelection();
                btnCopy.disabled = true;
                term.focus();
            }
            function copiar() {
                const texto = term.getSelection() || ultimaSelecao;
                if (!texto) { toast('Selecione um trecho do terminal primeiro'); return; }
                if (clipboardApi) {
                    clipboardApi.writeText(texto).then(copiado, () => {
                        if (copiarExecCommand(texto)) copiado(); else copiarManual(texto);
                    });
                    return;
                }
                // Síncrono: execCommand só funciona dentro do clique do usuário.
                if (copiarExecCommand(texto)) copiado(); else copiarManual(texto);
            }
            function copiarManual(texto) {
                abrirClip({
                    titulo: 'Copiar do terminal',
                    dica: 'O navegador bloqueou a cópia automática. O texto já está selecionado: copie com Ctrl+C (ou toque e segure → Copiar).',
                    texto, ok: 'Pronto', somenteLeitura: true,
                    acao: () => { fecharClip(); ultimaSelecao = ''; term.clearSelection(); btnCopy.disabled = true; },
                });
            }
            btnCopy.addEventListener('click', copiar);

            // Colar
            const emitirPaste = (t) => {
                const input = t.replace(/\r?\n/g, '\r');
                if (input) socket.emit('terminal_input', { ip, alias, input });
            };
            term.onData(data => socket.emit('terminal_input', { ip, alias, input: data }));

            function colarManual() {
                abrirClip({
                    titulo: 'Colar no terminal',
                    dica: 'Cole o texto abaixo (Ctrl+V ou toque e segure → Colar) e clique em Enviar.',
                    ok: 'Enviar', somenteLeitura: false,
                    acao: (texto) => {
                        if (!texto) { toast('Nada para colar'); return; }
                        fecharClip();
                        emitirPaste(texto);
                        toast('Colado!');
                    },
                });
            }
            function colar() {
                if (!clipboardApi || !clipboardApi.readText) { colarManual(); return; }
                clipboardApi.readText().then((texto) => {
                    if (!texto) { colarManual(); return; }
                    emitirPaste(texto);
                    toast('Colado!');
                    term.focus();
                }, colarManual);
            }
            $('btnPaste').addEventListener('click', colar);

            // ---- Limpar / Reconectar / Tela cheia ----
            $('btnClear').addEventListener('click', () => term.clear());
            $('btnReconnect').addEventListener('click', () => {
                toast('Reconectando...');
                if (socket.connected) socket.disconnect();
                socket.connect();
            });
            $('btnFullscreen').addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else document.documentElement.requestFullscreen().catch(() => toast('Tela cheia indisponível'));
            });
            const onFs = () => setTimeout(() => fitAddon.fit(), 80);
            document.addEventListener('fullscreenchange', onFs);

            // ---- Socket.IO ----
            function sendResize() {
                socket.emit('terminal_resize', { ip, alias, cols: term.cols, rows: term.rows });
            }
            // Entra na sala do terminal: o Host só manda a saída deste worker
            // para quem o abriu (refeito a cada reconexão do Socket.IO)
            const onConnect = () => {
                socket.emit('terminal_assinar', { ip, alias });
                setStatus('Conectado ao Host. Aguardando Node...', '#34d399', 'online');
                sendResize();
            };
            const onDisconnect = () => setStatus('Conexão perdida', '#f87171', 'offline');
            const evento = `output_for_${ip}_${alias}`;
            const onOutput = (data) => {
                term.write(data.output);
                if (statusEl.innerText !== 'Node ativo') setStatus('Node ativo', '#34d399', 'online');
            };

            socket.on('connect', onConnect);
            socket.on('disconnect', onDisconnect);
            socket.on(evento, onOutput);
            if (socket.connected) onConnect();

            term.onResize(sendResize);
            const onWinResize = () => { fitAddon.fit(); sendResize(); };
            const onOrient = () => setTimeout(onWinResize, 200);
            window.addEventListener('resize', onWinResize);
            window.addEventListener('orientationchange', onOrient);
            setTimeout(onWinResize, 100);

            cleanup = () => {
                socket.emit('terminal_cancelar', { ip, alias });
                socket.off('connect', onConnect);
                socket.off('disconnect', onDisconnect);
                socket.off(evento, onOutput);
                window.removeEventListener('resize', onWinResize);
                window.removeEventListener('orientationchange', onOrient);
                document.removeEventListener('fullscreenchange', onFs);
                term.dispose();
                view.classList.remove('md:overflow-hidden');
                view.classList.add('md:overflow-y-auto');
            };
        }

        // =====================================================================
        // VIEW: Arquivos da pasta home (/root) do worker
        //   GET  /api/node/<ip>/worker/<alias>/arquivos?caminho=   -> listar
        //   GET  .../arquivos/baixar?caminho=   (arquivo, ou pasta em .zip)
        //   POST .../arquivos/enviar?caminho=   (corpo = o arquivo)
        //   POST .../arquivos/pasta?caminho=  ·  .../arquivos/apagar?caminho=
        //   ?p=<caminho> na URL guarda a pasta aberta (o voltar do navegador funciona)
        // =====================================================================
        function viewArquivos(ip, alias) {
            setNav(ip);
            setFooter(`<div class="flex items-center gap-2">${svg(ICON.folder, 'w-4 h-4')}Pasta home do worker</div>`);
            const api = `/api/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}/arquivos`;
            const base = `/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}/arquivos`;
            const juntar = (...p) => p.filter(Boolean).join('/');
            const q = (rel) => '?caminho=' + encodeURIComponent(rel);
            let caminho = (new URLSearchParams(location.search).get('p') || '').split('/').filter(Boolean).join('/');
            let itens = [], visiveis = [], vivo = true, enviando = false, xhrAtual = null, geracao = 0;
            let ocultos = false;
            try { ocultos = localStorage.getItem('fmOcultos') === '1'; } catch (_) { }

            $('view').innerHTML = `
            <div class="max-w-[1400px] px-5 md:px-10 pt-6 md:pt-9 pb-14 flex flex-col gap-5">
                <header class="flex items-end justify-between gap-4 flex-wrap">
                    <div>
                        <h1 class="section-title text-[26px] tracking-tight flex items-center gap-2.5">Worker <span class="chip">${esc(alias)}</span></h1>
                        <p class="mt-1 text-[13.5px] text-muted">Node ${esc(ip)} — arquivos da pasta <code class="text-slate-300">/root</code> (a home do terminal).</p>
                        <div class="mt-3">${abasWorker(ip, alias, 'arquivos')}</div>
                    </div>
                    <a href="/node/${esc(ip)}" data-link class="btn btn-ghost">${svg(ICON.back)}Voltar ao node</a>
                </header>

                <section id="fmArea" class="card card-static !p-0 overflow-hidden relative">
                    <div class="flex items-center justify-between gap-3 flex-wrap px-4 py-3 border-b border-slate-400/15">
                        <nav id="fmTrilha" class="flex items-center gap-1 flex-wrap min-w-0 text-[13px] font-mono" aria-label="Pasta atual"></nav>
                        <div class="flex gap-2 flex-wrap items-center">
                            <label class="flex items-center gap-1.5 text-[12px] text-muted cursor-pointer select-none mr-1">
                                <input type="checkbox" id="fmOcultos" class="accent-[#e94560]" ${ocultos ? 'checked' : ''}>Ocultos
                            </label>
                            <button class="btn btn-ghost !px-3" id="fmAtualizar" title="Atualizar" aria-label="Atualizar">${svg(ICON.refresh)}</button>
                            <button class="btn btn-ghost" id="fmNovaPasta">${svg(ICON.folderPlus)}Nova pasta</button>
                            <button class="btn btn-dark" id="fmBtnArquivos">${svg(ICON.upload)}Enviar arquivos</button>
                            <button class="btn btn-dark" id="fmBtnPasta">${svg(ICON.folder)}Enviar pasta</button>
                            <button class="btn btn-ghost" id="fmBaixarAtual" title="Baixa a pasta aberta como .zip">${svg(ICON.download)}Baixar .zip</button>
                        </div>
                    </div>
                    <div id="fmProgresso" class="hidden px-4 py-3 border-b border-slate-400/15 bg-slate-950/30">
                        <div class="flex justify-between gap-3 text-[12.5px] mb-1.5">
                            <span id="fmProgTexto" class="truncate min-w-0"></span>
                            <span class="flex items-center gap-3 shrink-0"><span id="fmProgPct" class="font-bold"></span>
                            <button type="button" id="fmCancelar" class="text-muted hover:text-bad text-[12px] underline">Cancelar</button></span>
                        </div>
                        <div class="h-1.5 rounded-full bg-slate-950/45 border border-slate-400/15 overflow-hidden">
                            <div id="fmProgBarra" class="h-full rounded-full bg-accent transition-[width] duration-200" style="width:0%"></div>
                        </div>
                        <div id="fmProgErros" class="text-[12px] text-bad mt-2 hidden"></div>
                    </div>
                    <div id="fmLista" class="min-h-[240px]"></div>
                    <div id="fmSoltar" class="hidden absolute inset-0 z-10 items-center justify-center bg-slate-950/75 border-2 border-dashed border-accent rounded-[inherit] pointer-events-none">
                        <div class="text-center">${svg(ICON.upload, 'w-10 h-10 mx-auto text-accent')}
                            <p class="mt-2 font-semibold text-white">Solte para enviar</p>
                            <p class="text-[12.5px] text-muted font-mono" id="fmSoltarDestino"></p></div>
                    </div>
                </section>
                <p class="text-[11.5px] text-muted">Arraste arquivos ou pastas para a lista para enviar. Pastas são baixadas como <code>.zip</code>. Links simbólicos que apontam para fora de <code>/root</code> aparecem, mas não são seguidos.</p>
            </div>
            <input type="file" id="fmInArquivos" multiple class="hidden">
            <input type="file" id="fmInPasta" webkitdirectory multiple class="hidden">
            <iframe id="fmBaixar" class="hidden" title="download"></iframe>`;

            const lista = $('fmLista');
            const caminhoTela = (rel) => '/root' + (rel ? '/' + rel : '');

            function trilha() {
                const partes = caminho ? caminho.split('/') : [];
                const link = (rel, txt) => `<button type="button" data-ir="${esc(rel)}" class="px-1.5 py-0.5 rounded hover:bg-slate-400/10 hover:text-white text-muted">${esc(txt)}</button>`;
                let html = link('', '~ /root');
                partes.forEach((p, i) => {
                    html += `<span class="text-slate-500">/</span>`;
                    html += i === partes.length - 1
                        ? `<span class="px-1.5 py-0.5 text-white truncate max-w-[220px]">${esc(p)}</span>`
                        : link(partes.slice(0, i + 1).join('/'), p);
                });
                $('fmTrilha').innerHTML = html;
                $('fmSoltarDestino').innerText = caminhoTela(caminho);
            }

            const quando = (t) => t ? new Date(t * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';

            function desenhar() {
                visiveis = itens.filter(i => ocultos || !i.nome.startsWith('.'));
                const linha = (conteudo) => `<div class="flex items-center gap-3 px-4 py-2 border-b border-slate-400/10 hover:bg-slate-400/5 min-h-[46px]">${conteudo}</div>`;
                let html = '';
                if (caminho) {
                    const pai = caminho.split('/').slice(0, -1).join('/');
