<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidServer — Painel de Orquestração</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/droidserver-favicon.svg') }}">

    <!-- Bibliotecas servidas pelo próprio Host: o painel funciona sem internet
         (versões e licenças em static/vendor/LEIAME.md) -->
    <script src="{{ url_for('static', filename='vendor/tailwind-3.4.17.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/poppins.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/xterm-5.3.0.css') }}">
    <script src="{{ url_for('static', filename='vendor/xterm-5.3.0.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/xterm-addon-fit-0.8.0.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/socket.io-4.7.2.min.js') }}"></script>

    <script>
        // Tema no padrão do portfolio-page (github.com/JPedroCMartins/portfolio-page):
        // fundo #1a1a2e, cards #16213e, detalhe #0f3460, destaque #e94560, fonte Poppins.
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'] },
                    colors: {
                        bg: '#1a1a2e',
                        surface: '#16213e',
                        surface2: '#0f3460',
                        term: '#12121f',
                        muted: '#a7a9be',
                        accent: '#e94560',
                        accent2: '#ff8fa3',
                        ok: '#34d399',
                        bad: '#f87171',
                        warn: '#fbbf24',
                    },
                    boxShadow: {
                        card: '0 5px 20px rgba(0,0,0,.3)',
                        glow: '0 10px 30px rgba(233,69,96,.2)',
                    },
                    keyframes: {
                        pulseDot: {
                            '0%': { boxShadow: '0 0 0 0 rgba(52,211,153,.55)' },
                            '70%': { boxShadow: '0 0 0 8px rgba(52,211,153,0)' },
                            '100%': { boxShadow: '0 0 0 0 rgba(52,211,153,0)' },
                        },
                        shimmer: { from: { backgroundPosition: '200% 0' }, to: { backgroundPosition: '-200% 0' } },
                        fadeUp: { from: { opacity: '0', transform: 'translateY(18px)' }, to: { opacity: '1', transform: 'none' } },
                    },
                    animation: {
                        pulseDot: 'pulseDot 2s infinite',
                        shimmer: 'shimmer 1.4s infinite',
                        fadeUp: 'fadeUp .6s ease both',
                    },
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer components {
            .card {
                @apply bg-surface border border-transparent rounded-xl shadow-card transition duration-300 hover:-translate-y-1 hover:shadow-glow hover:border-accent/40;
            }
            .card-static { @apply hover:translate-y-0 hover:shadow-card hover:border-transparent; }
            .btn {
                @apply inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg border-2 border-transparent text-[12.5px] font-semibold leading-none cursor-pointer transition-all duration-300 disabled:opacity-45 disabled:cursor-not-allowed;
            }
            .btn svg { @apply w-4 h-4; }
            .btn-primary { @apply bg-accent border-accent text-white hover:bg-transparent hover:text-accent; }
            .btn-success { @apply bg-accent border-accent text-white hover:bg-transparent hover:text-accent px-[18px] py-[11px] text-[13.5px]; }
            .btn-danger { @apply bg-bad/10 text-bad border-bad/30 hover:bg-bad/20; }
            .btn-dark { @apply bg-transparent text-accent border-accent/60 hover:bg-accent hover:text-white hover:border-accent; }
            .btn-ghost { @apply bg-surface2 text-muted border-surface2 hover:text-white hover:border-accent/50; }
            .pill { @apply text-[11.5px] font-semibold px-3 py-1 rounded-full tracking-wide uppercase; }
            .pill-online { @apply bg-ok/15 text-ok; }
            .pill-offline { @apply bg-bad/15 text-bad; }
            .pill-warn { @apply bg-warn/15 text-warn; }
            .pill-muted { @apply bg-slate-400/15 text-slate-400; }
            .chip { @apply inline-flex items-center gap-1.5 text-xs font-medium bg-surface2 text-muted px-3 py-1 rounded-md; }
            .dot { @apply w-2.5 h-2.5 rounded-full shrink-0; }
            .dot-online { @apply bg-ok shadow-[0_0_12px_rgba(52,211,153,.7)]; }
            .dot-offline { @apply bg-bad shadow-[0_0_12px_rgba(248,113,113,.6)]; }
            .dot-idle { @apply bg-warn shadow-[0_0_12px_rgba(251,191,36,.6)]; }
            .nav-item { @apply flex items-center gap-3 px-3 py-2.5 rounded-lg text-[13.5px] font-medium text-muted transition duration-300 hover:text-accent; }
            .nav-item.active { @apply text-accent bg-accent/10 shadow-[inset_3px_0_0_#e94560]; }
            .label-xs { @apply text-[10.5px] uppercase tracking-widest text-muted font-semibold; }
            .input { @apply w-full px-3.5 py-2.5 bg-bg border-2 border-surface2 rounded-lg text-sm text-[#f0f0f0] outline-none transition placeholder:text-slate-500 focus:border-accent; }
            .spinner { @apply w-3.5 h-3.5 rounded-full border-2 border-accent/25 border-t-accent animate-spin shrink-0; }
            .spinner-muted { @apply border-slate-400/20 border-t-muted; }
            /* Título com a barra de destaque embaixo (.section-title do portfolio) */
            .section-title { @apply relative pb-3 font-semibold; }
            .section-title::after { content: ''; @apply absolute left-0 bottom-0 w-20 h-1 rounded-sm bg-accent; }
            /* Hero: gradiente 135° + brilho que segue o mouse (#inicio do portfolio) */
            .hero { @apply relative overflow-hidden rounded-xl shadow-card bg-[linear-gradient(135deg,#1a1a2e_0%,#0f3460_100%)]; }
            .hero::before { content: ''; @apply absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-500;
                background: radial-gradient(circle 500px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(233, 69, 96, .15), transparent 40%); }
            .hero:hover::before { @apply opacity-100; }
            .hero > * { @apply relative; }
        }
    </style>

    <style>
        body {
            background: #1a1a2e;
            color: #f0f0f0;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4 { font-weight: 600; color: #f0f0f0; }
        .skeleton {
            background: linear-gradient(90deg, rgba(167,169,190,.08) 25%, rgba(167,169,190,.16) 50%, rgba(167,169,190,.08) 75%);
            background-size: 200% 100%;
        }
        /* Entrada suave dos blocos ao trocar de tela (equivale ao AOS fade-up do portfolio) */
        #view > * { animation: fadeUpIn .6s ease both; }
        @keyframes fadeUpIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) {
            #view > * { animation: none; }
            .card, .btn { transition: none !important; }
        }
        .xterm .xterm-viewport { background-color: transparent !important; }
        .xterm-screen { padding: 12px; }
    </style>
</head>

<body class="font-sans text-slate-200 min-h-screen">
    <div class="flex flex-col md:flex-row md:h-screen min-h-screen">

        <!-- ================= Sidebar ================= -->
        <aside class="md:w-64 shrink-0 bg-surface shadow-[0_4px_10px_rgba(0,0,0,.3)] border-b md:border-b-0 md:border-r border-surface2 px-4 py-4 md:py-6 flex md:flex-col items-center md:items-stretch justify-between md:justify-start gap-3 md:gap-7 md:overflow-y-auto">
            <a href="/" data-link class="flex items-center gap-3 px-2">
                <img src="{{ url_for('static', filename='img/droidserver-icone.svg') }}" alt="" class="w-11 h-11 shrink-0 drop-shadow-[0_0_8px_rgba(233,69,96,.35)]">
                <div class="flex flex-col leading-tight">
                    <strong class="text-[15px] font-bold tracking-wide">DroidServer</strong>
                    <span class="text-[11px] text-muted uppercase tracking-wider">Cluster</span>
                </div>
            </a>

            <nav class="flex md:flex-col gap-1.5" id="nav"></nav>

            <div class="hidden md:block mt-auto p-3.5 border border-slate-400/15 rounded-xl bg-white/[.02] text-xs text-muted leading-relaxed" id="sidebarFooter"></div>
            {% if senha_exigida %}
            <form method="post" action="/logout" class="md:-mt-4">
                <button type="submit" class="nav-item w-full text-left" title="Sair do painel">Sair</button>
            </form>
            {% endif %}
        </aside>

        <!-- ================= Conteúdo ================= -->
        <main id="view" class="flex-1 min-w-0 md:overflow-y-auto"></main>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-lg border border-slate-400/15 bg-[#16213e]/95 text-slate-200 shadow-card text-[12.5px] font-semibold opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <script>
        // =====================================================================
        // Utilidades
        // =====================================================================
        const $ = (id) => document.getElementById(id);
        const TUNNEL = 'tunnel';  // nome reservado do Cloudflare Tunnel (um por node)
        const TUNNEL_TOKEN_RE = /^[A-Za-z0-9+/=_-]{40,4096}$/;
        // Texto das tarefas da fila: [executando, aguardando, resultado]
        const TAREFAS = {
            criar_worker: ['Criando', 'Criar', 'Criação'],
            deletar_worker: ['Deletando', 'Deletar', 'Deleção'],
            configurar_tunnel: ['Configurando', 'Configurar', 'Configuração do'],
            remover_tunnel: ['Removendo', 'Remover', 'Remoção do'],
        };
        const textoTarefa = (acao, i) => (TAREFAS[acao] || TAREFAS.deletar_worker)[i];
        const TOM_PILL = { ok: 'pill-online', warn: 'pill-warn', bad: 'pill-offline', muted: 'pill-muted' };
        const ehTarefaTunnel = (t) => t && (t.acao === 'configurar_tunnel' || t.acao === 'remover_tunnel');
        const ALIAS_RE = /^[A-Za-z0-9_-]{1,64}$/;

        const esc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        function fmtBytes(n) {
            if (n == null) return '—';
            const u = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
            return `${n.toFixed(1)} ${u[i]}`;
        }

        const isOnline = (info) => (info.status || 'Offline').toLowerCase() === 'online';

        let toastTimer = null;
        function toast(msg) {
            const el = $('toast');
            el.innerText = msg;
            el.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.add('opacity-0'), 2200);
        }

        // Ícones (stroke)
        const svg = (inner, cls = '') =>
            `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
        const ICON = {
            dash: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
            pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
            server: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>',
            check: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>',
            box: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
            refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
            back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
            plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
            radar: '<path d="M19.07 4.93A10 10 0 1 0 22 12"/><path d="M16.24 7.76A6 6 0 1 0 18 12"/><circle cx="12" cy="12" r="2"/><path d="m13.4 10.6 6.6-6.6"/>',
            unlink: '<path d="m18.84 12.25 1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="m5.17 11.75-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71"/><path d="m8 2 0 3"/><path d="m2 8 3 0"/><path d="m16 22 0-3"/><path d="m22 16-3 0"/>',
            chevron: '<path d="m5 8 6 6 6-6"/>',
            arrowRight: '<path d="m9 6 6 6-6 6"/>',
            close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
            terminal: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 15 5-5 5 5"/>',
            trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
            copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
            paste: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><path d="m9 14 2 2 4-4"/>',
            eraser: '<path d="m3 21 5-5"/><path d="m15 21 6-6"/><path d="M3 21h18"/><path d="m11.5 3.5 9 9-8 8h-1l-9-9z"/>',
            play: '<path d="M6 4v16l14-8z"/>',
            stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
            save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/>',
            pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
            gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
            db: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/>',
            cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>',
            folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>',
            folderPlus: '<path d="M12 10v6"/><path d="M9 13h6"/><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/>',
            file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
            upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
            link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
            full: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
        };

        function metricBar(label, pct, sub) {
            const p = (pct == null) ? 0 : Math.max(0, Math.min(100, pct));
            const val = (pct == null) ? '—' : `${pct}%`;
            return `
            <div class="flex-1 min-w-[200px]">
                <div class="flex justify-between items-center mb-1.5">
                    <span class="label-xs tracking-[.09em]">${label}</span>
                    <span class="text-xs font-bold">${val}</span>
                </div>
                <div class="h-1.5 rounded-full bg-slate-950/45 border border-slate-400/15 overflow-hidden">
                    <div class="h-full rounded-full bg-accent transition-[width] duration-500" style="width:${p}%"></div>
                </div>
                ${sub ? `<div class="text-[11px] text-muted mt-1">${sub}</div>` : ''}
            </div>`;
        }

        // CPU: a do aparelho inteiro só existe quando o Android permite ler
        // /proc/stat (versões recentes negam). A do DroidServer soma os processos
        // do Termux (agente + workers) e sempre está disponível. Ambas em % do aparelho.
        function cpuBars(info) {
            const termux = metricBar('CPU DroidServer', info.cpu_termux, 'agente + workers · % do aparelho');
            return (info.cpu != null ? metricBar('CPU aparelho', info.cpu) : '') + termux;
        }

        const fmtPct = (v) => (v == null ? '—' : `${v}%`);

        // Estado do serviço de um worker -> tom e rótulo exibidos no painel
        function estadoServico(sv, stSupervisor) {
            const st = (sv && sv.estado) || stSupervisor || null;
            if (sv && sv.gerenciado && !sv.tem_script && st === 'RUNNING')
                return { tone: 'warn', label: 'Aguardando run.sh', st };
            if (st === 'RUNNING') return { tone: 'ok', label: 'Rodando', st };
            if (st === 'STARTING') return { tone: 'warn', label: 'Iniciando', st };
            if (st === 'BACKOFF') return { tone: 'bad', label: 'Reiniciando após falha', st };
            if (st === 'FATAL') return { tone: 'bad', label: 'Falhou', st };
            if (st === 'STOPPED' || st === 'EXITED') return { tone: 'muted', label: 'Parado', st };
            if (st === 'STOPPING') return { tone: 'warn', label: 'Parando', st };
            return { tone: 'muted', label: st || 'Sem serviço', st };
        }

        // Workers de banco não têm a aba Arquivos (o terminal deles é o psql).
        // O tipo vem do /api/node/<ip>; enquanto não chega, vale o último conhecido.
        const workersBanco = new Set();
        function marcarTipoWorker(ip, alias, ehBanco) {
            const chave = ip + '|' + alias;
            if (ehBanco) workersBanco.add(chave); else workersBanco.delete(chave);
            document.querySelectorAll('[data-aba-arquivos]').forEach(a => {
                if (a.dataset.abaArquivos === chave) a.classList.toggle('hidden', ehBanco);
            });
            const arquivos = `/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}/arquivos`;
            if (ehBanco && location.pathname === arquivos) {
                history.replaceState({}, '', arquivos.replace(/\/arquivos$/, ''));
                route();
            }
        }
        async function conferirTipoWorker(ip, alias) {
            try {
                const res = await fetch(`/api/node/${encodeURIComponent(ip)}`);
                if (!res.ok) return;
                const n = await res.json();
                const sv = (n.servicos || {})[alias];
                if (sv) marcarTipoWorker(ip, alias, sv.tipo === 'postgres');
            } catch (_) { }
        }

        // Abas da página do worker
        function abasWorker(ip, alias, ativa) {
            setTimeout(() => conferirTipoWorker(ip, alias), 0);
            const aba = (id, href, icone, texto, extra = '') => `
                <a href="${href}" data-link ${extra} class="${extra.includes('data-aba-arquivos') && workersBanco.has(ip + '|' + alias) ? 'hidden ' : ''}flex items-center gap-2 px-4 py-2 rounded-lg text-[13px] font-semibold transition
                    ${ativa === id ? 'bg-accent/20 text-white shadow-[inset_0_-2px_0_#e94560]' : 'text-muted hover:text-slate-200 hover:bg-slate-400/10'}">
                    ${svg(icone, 'w-4 h-4')}${texto}</a>`;
            const base = `/node/${encodeURIComponent(ip)}/worker/${encodeURIComponent(alias)}`;
            return `<nav class="flex gap-1 p-1 rounded-xl bg-surface border border-slate-400/15 w-fit">
                ${aba('servico', base, ICON.gear, 'Serviço')}${aba('terminal', base + '/terminal', ICON.terminal, 'Terminal')}${aba('arquivos', base + '/arquivos', ICON.folder, 'Arquivos', `data-aba-arquivos="${esc(ip + '|' + alias)}"`)}</nav>`;
        }

        // Abas da página do node
        function abasNode(ip, ativa) {
            const aba = (id, href, icone, texto) => `
                <a href="${href}" data-link class="flex items-center gap-2 px-4 py-2 rounded-lg text-[13px] font-semibold transition
                    ${ativa === id ? 'bg-accent/20 text-white shadow-[inset_0_-2px_0_#e94560]' : 'text-muted hover:text-slate-200 hover:bg-slate-400/10'}">
                    ${svg(icone, 'w-4 h-4')}${texto}</a>`;
            const base = `/node/${encodeURIComponent(ip)}`;
            return `<nav class="flex gap-1 p-1 rounded-xl bg-surface border border-slate-400/15 w-fit">
                ${aba('geral', base, ICON.server, 'Visão geral')}${aba('monitor', base + '/monitor', ICON.pulse, 'Monitor')}</nav>`;
        }

        function topbar(title, subtitle, actions = '') {
            return `
            <header class="flex items-end justify-between gap-4 flex-wrap mb-7">
                <div>
                    <h1 class="section-title text-[26px] tracking-tight">${title}</h1>
                    <p class="mt-1.5 text-[13.5px] text-muted" id="subtitle">${subtitle}</p>
                </div>
                <div class="flex items-center gap-3.5">${actions}</div>
            </header>`;
        }

        // =====================================================================
        // Socket.IO (único para todo o app)
        // =====================================================================
        // Sessão expirada (ou Host reiniciado com outra senha): volta ao login.
        const irParaLogin = () => { location.href = '/login?proximo=' + encodeURIComponent(location.pathname); };
        const fetchOriginal = window.fetch.bind(window);
        window.fetch = async (...args) => {
            const resp = await fetchOriginal(...args);
            if (resp.status === 401 && {{ 'true' if senha_exigida else 'false' }}) irParaLogin();
            return resp;
        };
        const socket = io();
        let cleanup = () => { };

        // =====================================================================
        // Gráfico de uso (CPU DroidServer + RAM) — SVG puro, sem biblioteca.
        // Paleta validada (dataviz) contra o fundo #16213e: todas as checagens ok.
        // =====================================================================
        const SERIES = [
            { chave: 'cpu', nome: 'CPU DroidServer', cor: '#e94560' },
            { chave: 'ram', nome: 'RAM', cor: '#4ea8de' },
        ];
        const JANELA_S = 600; // últimos 10 minutos
        const graficosAbertos = new Set(); // IPs com o card de gráfico aberto
        const ultimoHistorico = new Map();  // última série recebida, para redesenhar sem piscar
        const idDoIp = (ip) => 'g-' + String(ip).replace(/[^A-Za-z0-9]/g, '-');

        function cardGrafico(ip) {
            const id = idDoIp(ip);
            const legenda = SERIES.map(s => `
                <span class="flex items-center gap-1.5 text-[11.5px] text-muted">
                    <span class="inline-block w-3 h-[3px] rounded-full" style="background:${s.cor}"></span>${s.nome}
                </span>`).join('');
            return `
            <article class="card card-static relative p-5 flex flex-col gap-3" id="${id}" aria-label="Uso em tempo real do node ${esc(ip)}">
                <div class="flex items-start justify-between gap-3">
                    <div>
                        <h3 class="text-[14px] font-bold">Uso em tempo real</h3>
                        <p class="text-[11.5px] text-muted mt-0.5">${esc(ip)} · últimos 10 min · % do aparelho</p>
                    </div>
                    <button type="button" class="btn btn-ghost !px-2 !py-1.5" data-grafico="${esc(ip)}" aria-label="Fechar gráfico">${svg(ICON.close)}</button>
                </div>
                <div class="flex gap-4">${legenda}</div>
                <div class="relative" data-area>
                    <div class="h-[150px] grid place-items-center text-[12px] text-muted">Carregando…</div>
                </div>
            </article>`;
        }

        // Gráfico de linhas em SVG. Sem opções, é o card "Uso em tempo real" do
        // dashboard (últimos 10 min, % do aparelho); a aba Monitor passa outra
        // área, janela, séries e unidade (ex.: MB, com teto automático).
        function desenharGrafico(ip, amostras, { area = null, series = SERIES, janela = JANELA_S, unidade = '%', teto = 100, rotulo = '−10 min', vazio = 'Aguardando amostras — o node grava uma a cada 10 s.' } = {}) {
            area = area || document.querySelector(`#${idDoIp(ip)} [data-area]`);
            if (!area) return;
            const pts = (amostras || []).filter(a => a && typeof a.t === 'number');
            if (pts.length < 2) {
                area.innerHTML = '<div class="h-[150px] grid place-items-center text-[12px] text-muted text-center px-4">' + esc(vazio) + '</div>';
                return;
            }
            const W = 320, H = 150, L = 34, R = 58, T = 8, B = 20;
            const tMax = pts[pts.length - 1].t, tMin = tMax - janela;
            const vis = pts.filter(a => a.t >= tMin);
            if (teto == null) {  // teto automático: maior valor arredondado para cima
                const maior = Math.max(1, ...vis.flatMap(a => series.map(s => a[s.chave] ?? 0)));
                const passo = 10 ** Math.floor(Math.log10(maior));
                teto = Math.ceil(maior / passo) * passo;
            }
            const fmt = (v) => v == null ? '—' : `${v}${unidade === '%' ? '%' : ' ' + unidade}`;
            const fmtT = (t) => janela > 86400 ? new Date(t * 1000).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
                : new Date(t * 1000).toLocaleTimeString('pt-BR');
            const x = (t) => L + (t - tMin) / janela * (W - L - R);
            const y = (v) => T + (1 - Math.max(0, Math.min(teto, v)) / teto) * (H - T - B);

            // Linha de cada série; um valor nulo (ou um buraco no registro) quebra a linha
            const buraco = Math.max(janela / 60, 30);
            const caminho = (chave) => {
                let d = '', caneta = false, tAnt = null;
                for (const a of vis) {
                    const v = a[chave];
                    if (v == null || (tAnt != null && a.t - tAnt > buraco)) caneta = false;
                    tAnt = a.t;
                    if (v == null) continue;
                    d += `${caneta ? 'L' : 'M'}${x(a.t).toFixed(1)},${y(v).toFixed(1)}`;
                    caneta = true;
                }
                return d;
            };
            const grade = [0, teto / 2, teto].map(v => `
                <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(148,163,184,.14)" stroke-width="1"/>
                <text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="#a7a9be">${+v.toFixed(1)}${unidade === '%' ? '%' : ''}</text>`).join('');

            // Rótulo direto do valor atual de cada série, afastados se colidirem
            const ultimo = vis[vis.length - 1];
            const rotulos = series.filter(s => ultimo[s.chave] != null)
                .map(s => ({ ...s, v: ultimo[s.chave], yy: y(ultimo[s.chave]) }))
                .sort((a, b) => a.yy - b.yy);
            for (let i = 1; i < rotulos.length; i++) {
                if (rotulos[i].yy - rotulos[i - 1].yy < 13) rotulos[i].yy = rotulos[i - 1].yy + 13;
            }
            const marcas = rotulos.map(s => `
                <circle cx="${x(ultimo.t)}" cy="${y(s.v)}" r="4" fill="${s.cor}" stroke="#16213e" stroke-width="2"/>
                <text x="${x(ultimo.t) + 8}" y="${s.yy + 3.5}" font-size="11" font-weight="700" fill="#f0f0f0">${fmt(s.v)}</text>`).join('');

            const resumo = series.map(s => `${s.nome} ${ultimo[s.chave] != null ? fmt(ultimo[s.chave]) : 'indisponível'}`).join(', ');
            area.innerHTML = `
                <svg viewBox="0 0 ${W} ${H}" class="w-full h-[150px] overflow-visible" role="img" aria-label="${esc(rotulo)} até agora: ${esc(resumo)}">
                    ${grade}
                    <text x="${L}" y="${H - 4}" font-size="10" fill="#a7a9be">${esc(rotulo)}</text>
                    <text x="${W - R}" y="${H - 4}" font-size="10" fill="#a7a9be" text-anchor="end">agora</text>
                    ${series.map(s => `<path d="${caminho(s.chave)}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}
                    ${marcas}
                    <line data-mira x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#a7a9be" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
                    <rect data-alvo x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>
                </svg>
                <div data-dica class="hidden absolute top-0 pointer-events-none px-2.5 py-1.5 rounded-lg border border-slate-400/20 bg-[#16213e]/95 text-[11.5px] leading-snug shadow-card whitespace-nowrap"></div>
                <details class="mt-1 text-[11.5px] text-muted">
                    <summary class="cursor-pointer select-none">Ver como tabela</summary>
                    <table class="mt-2 w-full text-left">
                        <thead><tr><th class="font-semibold">Hora</th>${series.map(s => `<th class="font-semibold">${s.nome}</th>`).join('')}</tr></thead>
                        <tbody>${vis.slice(-6).reverse().map(a => `<tr><td>${fmtT(a.t)}</td>${series.map(s => `<td>${fmt(a[s.chave])}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </details>`;

            // Mira + dica: amostra mais próxima do ponteiro
            const svgEl = area.querySelector('svg'), alvo = area.querySelector('[data-alvo]');
            const mira = area.querySelector('[data-mira]'), dica = area.querySelector('[data-dica]');
            const mover = (ev) => {
                const r = svgEl.getBoundingClientRect();
                const px = (ev.clientX - r.left) / r.width * W;
                const t = tMin + (px - L) / (W - L - R) * janela;
                let a = vis[0];
                for (const p of vis) if (Math.abs(p.t - t) < Math.abs(a.t - t)) a = p;
                const ax = x(a.t);
                mira.setAttribute('x1', ax); mira.setAttribute('x2', ax); mira.setAttribute('visibility', 'visible');
                dica.innerHTML = `<div class="text-muted mb-0.5">${fmtT(a.t)}</div>` +
                    series.map(s => `<div class="flex items-center gap-1.5"><span class="inline-block w-2 h-2 rounded-full" style="background:${s.cor}"></span><span class="text-slate-200">${s.nome}: <strong>${fmt(a[s.chave])}</strong></span></div>`).join('');
                dica.classList.remove('hidden');
                const left = ax / W * r.width;
                dica.style.left = Math.min(Math.max(left - dica.offsetWidth / 2, 0), r.width - dica.offsetWidth) + 'px';
            };
            alvo.addEventListener('mousemove', mover);
            alvo.addEventListener('mouseleave', () => { mira.setAttribute('visibility', 'hidden'); dica.classList.add('hidden'); });
        }

        async function atualizarGraficos() {
            for (const ip of graficosAbertos) {
                try {
                    const res = await fetch(`/api/node/${encodeURIComponent(ip)}/historico`);
                    if (!res.ok) continue;
                    const amostras = (await res.json()).amostras;
                    ultimoHistorico.set(ip, amostras);
                    desenharGrafico(ip, amostras);
                } catch (e) { /* falha momentânea de rede */ }
            }
        }

        // =====================================================================
        // Logs ao vivo (abas Serviço, Tunnel e Monitor)
        //   emit logs_assinar / logs_cancelar  -> on logs_saida {alias, linhas, inicial}
        // htmlLogs() desenha o card; painelLogs() liga os botões e a assinatura.
        // =====================================================================
        function htmlLogs(titulo, { altura = 'h-[340px]', extra = '' } = {}) {
            return `
                <section class="card card-static p-5 flex flex-col gap-3">
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                        <div class="flex items-center gap-2.5 flex-wrap">
                            <h2 class="text-[15px] font-bold">${titulo}</h2>
                            <span class="flex items-center gap-1.5 text-[11.5px] text-muted"><span class="w-2 h-2 rounded-full bg-ok animate-pulseDot" id="logsDot"></span><span id="logsEstado">ao vivo</span></span>
                            ${extra}
                        </div>
                        <div class="flex gap-2">
                            <button class="btn btn-ghost" id="btnPausar">${svg(ICON.pause)}Pausar</button>
                            <button class="btn btn-ghost" id="btnLimparLogs">${svg(ICON.eraser)}Limpar</button>
                            <button class="btn btn-ghost" id="btnBaixarLogs">${svg(ICON.download)}Baixar</button>
                        </div>
                    </div>
                    <pre id="logs" class="${altura} overflow-auto px-4 py-3 rounded-xl bg-term border border-slate-400/15 font-mono text-[12.5px] leading-relaxed text-slate-300 whitespace-pre-wrap break-all" aria-live="polite">Carregando logs…</pre>
                </section>`;
        }

        // vazio: texto quando não há linhas; arquivo(alias): nome do .log baixado;
        // aoReconectar: chamado (além de reassinar) quando o socket volta.
        function painelLogs(ip, alias, { vazio, arquivo = (a) => a, aoReconectar = () => { } } = {}) {
            const MAX_LINHAS = 2000;
            const pre = $('logs');
            let linhas = [], pausado = false, pendentes = [];
            function desenhar() {
                const noFim = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
                pre.textContent = linhas.length ? linhas.join('\n') : vazio;
                if (noFim) pre.scrollTop = pre.scrollHeight;
            }
            const onLogs = (d) => {
                if (!d || d.alias !== alias) return;
                if (d.inicial) { linhas = d.linhas.slice(); pendentes = []; }
                else if (pausado) { pendentes.push(...d.linhas); return; }
                else linhas.push(...d.linhas);
                if (linhas.length > MAX_LINHAS) linhas = linhas.slice(-MAX_LINHAS);
                desenhar();
                if (d.inicial) pre.scrollTop = pre.scrollHeight;
            };
            const assinar = () => socket.emit('logs_assinar', { ip, alias });
            const onConnect = () => { assinar(); aoReconectar(); };
            socket.on('logs_saida', onLogs);
            socket.on('connect', onConnect);
            assinar();

            $('btnPausar').addEventListener('click', () => {
                pausado = !pausado;
                $('btnPausar').innerHTML = pausado ? `${svg(ICON.play)}Retomar` : `${svg(ICON.pause)}Pausar`;
                $('logsEstado').textContent = pausado ? 'pausado' : 'ao vivo';
                $('logsDot').className = 'w-2 h-2 rounded-full ' + (pausado ? 'bg-warn' : 'bg-ok animate-pulseDot');
                if (!pausado && pendentes.length) { linhas.push(...pendentes); pendentes = []; desenhar(); }
            });
            $('btnLimparLogs').addEventListener('click', () => { linhas = []; pendentes = []; desenhar(); });
            $('btnBaixarLogs').addEventListener('click', () => {
                const blob = new Blob([linhas.join('\n') + '\n'], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `${arquivo(alias)}-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.log`;
                a.click();
                URL.revokeObjectURL(a.href);
            });

            return {
                // Troca o log acompanhado (aba Monitor: agente <-> supervisord)
                trocar(novo) {
                    if (novo === alias) return;
                    socket.emit('logs_cancelar', { ip, alias });
                    alias = novo; linhas = []; pendentes = [];
                    pre.textContent = 'Carregando logs…';
                    assinar();
                },
                parar() {
                    socket.emit('logs_cancelar', { ip, alias });
                    socket.off('logs_saida', onLogs);
                    socket.off('connect', onConnect);
                },
            };
        }

        // =====================================================================
        // Roteador (mesmas rotas do routes.py, via History API)
        //   /                          -> dashboard
        //   /node/<ip>                 -> detalhe do node
        //   /node/<ip>/worker/<alias>  -> terminal do worker
        // =====================================================================
        function go(path) {
            if (path === location.pathname) return;
            history.pushState({}, '', path);
            route();
        }

        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[data-link]');
            if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
            e.preventDefault();
            go(a.getAttribute('href'));
        });
        window.addEventListener('popstate', route);

        // Brilho que segue o mouse nos blocos .hero (efeito do portfolio-page)
        document.addEventListener('mousemove', (e) => {
            const hero = e.target.closest && e.target.closest('.hero');
            if (!hero) return;
            const r = hero.getBoundingClientRect();
            hero.style.setProperty('--mouse-x', (e.clientX - r.left) + 'px');
            hero.style.setProperty('--mouse-y', (e.clientY - r.top) + 'px');
        });

        function setNav(ip) {
            const items = [`<a href="/" data-link class="nav-item ${!ip ? 'active' : ''}">${svg(ICON.dash, 'w-[18px] h-[18px] shrink-0')}Dashboard</a>`];
            if (ip) items.push(`<a href="/node/${esc(ip)}" data-link class="nav-item active">${svg(ICON.pulse, 'w-[18px] h-[18px] shrink-0')}<span class="truncate">Node ${esc(ip)}</span></a>`);
            $('nav').innerHTML = `<span class="label-xs px-3 pb-2 hidden md:block">Menu</span>` + items.join('');
        }

        function setFooter(html) { $('sidebarFooter').innerHTML = html; }

        function route() {
            cleanup();
            cleanup = () => { };
            const path = location.pathname.replace(/\/+$/, '') || '/';
            let m;
            if ((m = path.match(/^\/node\/([^/]+)\/worker\/([^/]+)\/terminal$/))) {
                return viewTerminal(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
            }
            if ((m = path.match(/^\/node\/([^/]+)\/worker\/([^/]+)\/arquivos$/))) {
                return viewArquivos(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
            }
            if ((m = path.match(/^\/node\/([^/]+)\/tunnel$/))) {
                return viewTunnel(decodeURIComponent(m[1]));
            }
            if ((m = path.match(/^\/node\/([^/]+)\/monitor$/))) {
                return viewMonitor(decodeURIComponent(m[1]));
            }
            if ((m = path.match(/^\/node\/([^/]+)\/worker\/([^/]+)$/))) {
                return viewServico(decodeURIComponent(m[1]), decodeURIComponent(m[2]));
            }
            if ((m = path.match(/^\/node\/([^/]+)$/))) {
                return viewNode(decodeURIComponent(m[1]));
            }
            return viewDashboard();
        }

        // =====================================================================
        // VIEW: Dashboard  (GET /api/nodes)
        // =====================================================================
        function viewDashboard() {

                <div class="flex items-center gap-2 mb-2"><span class="dot dot-online !w-[9px] !h-[9px]"></span>Online</div>

            const statCard = (color, icon, id, label) => `
                <div class="card relative overflow-hidden px-6 py-5 flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl grid place-items-center shrink-0 ${color}">${svg(icon, 'w-[22px] h-[22px]')}</div>
                    <div>

                    </div>
                </div>`;

            $('view').innerHTML = `
            <div class="max-w-[1400px] px-5 md:px-10 pt-6 md:pt-9 pb-14">
                ${topbar('Dashboard', 'Visão geral do cluster e dos nodes conectados.', `
                    <span class="flex items-center gap-2 text-[12.5px] text-muted">
                        <span class="w-2 h-2 rounded-full bg-ok animate-pulseDot"></span>
                        Atualizado em <span id="updatedAt">—</span>
                    </span>
                    <button class="btn btn-ghost" id="btnRefresh">${svg(ICON.refresh)}Atualizar</button>
                    <button class="btn btn-primary" id="btnAdicionar" aria-expanded="false">${svg(ICON.plus)}Adicionar node</button>`)}

                <section id="painelAdicionar" class="hidden card card-static p-5 mb-7">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <div>
                            <h3 class="text-[15px] font-bold">Adicionar node</h3>
                            <p class="text-[12.5px] text-muted mt-1">Informe o IP do celular ou varra a rede. O agente precisa estar rodando no Termux (<code>bash android/run.sh -d</code>); ele responde na porta 5051.</p>
                        </div>
                        <button type="button" class="btn btn-ghost !px-2 !py-1.5" id="btnFecharAdicionar" aria-label="Fechar">${svg(ICON.close)}</button>
                    </div>
                    <div class="grid gap-5 md:grid-cols-2">
                        <form id="formAdicionarIp" class="flex flex-col gap-2">
                            <label for="ipNovo" class="label-xs">IP do node</label>
                            <div class="flex gap-2">
                                <input class="input" id="ipNovo" placeholder="ex: 192.168.1.4" inputmode="decimal" autocomplete="off" required>
                                <button type="submit" class="btn btn-success shrink-0">${svg(ICON.plus)}Adicionar</button>
                            </div>
                        </form>
                        <form id="formVarredura" class="flex flex-col gap-2">
                            <label for="redeVarredura" class="label-xs">Varrer rede</label>
                            <div class="flex gap-2">
                                <input class="input font-mono" id="redeVarredura" placeholder="192.168.1.0/24" autocomplete="off">
                                <button type="submit" class="btn btn-dark shrink-0" id="btnVarrer">${svg(ICON.radar)}Varrer</button>
                            </div>
                        </form>
                    </div>
                    <div id="resultadoVarredura" class="mt-4"></div>
                </section>

                <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-9">
                    ${statCard('bg-surface2 text-accent', ICON.server, 'statNodes', 'Nodes totais')}
                    ${statCard('bg-surface2 text-accent', ICON.check, 'statOnline', 'Nodes online')}
                    ${statCard('bg-surface2 text-accent', ICON.box, 'statWorkers', 'Workers ativos')}
                </section>

                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-[17px] font-bold">Nodes conectados</h2>
                    <span class="text-[12.5px] text-muted bg-slate-400/10 px-2.5 py-1 rounded-full" id="nodeCount">0 nodes</span>

                <section class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(320px,1fr))]" id="nodeGrid"></section>
            </div>`;

            const grid = $('nodeGrid');
            const skeletons = '<div class="skeleton h-[180px] rounded-2xl animate-shimmer"></div>'.repeat(2);
            grid.innerHTML = skeletons;

            const nodeCard = (ip, info) => {
                const workers = info.workers || [];
                const status = info.status || 'Offline';
                const online = isOnline(info);
                const aguardando = !!info.aguardando;
                const processando = (info.tarefas_pendentes || []).length > 0 || info.tarefa_atual;
                const mem = info.mem || {};
                const memSub = mem.total ? `${fmtBytes(mem.usado)} / ${fmtBytes(mem.total)}` : null;
                const chips = workers.length
                    ? workers.map(w => `<span class="chip">${esc(w)}</span>`).join('')
                    : '<span class="text-[12.5px] text-muted">Nenhum worker instalado</span>';

                return `
                <article class="card relative overflow-hidden p-5 pl-6 flex flex-col gap-4">

                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${processando ? '<span class="pill pill-warn">processando</span>' : ''}
                            <span class="pill ${online ? 'pill-online' : aguardando ? 'pill-warn' : 'pill-offline'}">${esc(aguardando ? 'Aguardando contato' : status)}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 p-3.5 bg-slate-950/35 border border-slate-400/15 rounded-xl">
                        <div class="flex flex-col gap-1">
                            <span class="label-xs tracking-wider">Último contato</span>
                            <span class="text-sm font-semibold">${esc(info.last_seen || '—')}</span>
                        </div>
                        <div class="flex flex-col gap-1">
                            <span class="label-xs tracking-wider">Workers</span>
                            <span class="text-sm font-semibold">${workers.length}</span>
                        </div>
                    </div>
                    <div class="flex flex-col gap-3.5">
                        ${cpuBars(info)}
                        ${metricBar('RAM', mem.percent, memSub)}
                    </div>
                    <div class="flex flex-wrap gap-2 min-h-6 items-center">${chips}</div>
                    <div class="flex gap-2.5 mt-auto">
                        <a href="/node/${esc(ip)}" data-link class="btn btn-primary">${svg(ICON.chevron)}Gerenciar Workers</a>
                        <button type="button" data-grafico="${esc(ip)}" aria-expanded="${graficosAbertos.has(ip)}"
                            title="${graficosAbertos.has(ip) ? 'Fechar' : 'Abrir'} o gráfico de CPU e RAM"
                            class="btn btn-ghost !px-3 ml-auto ${graficosAbertos.has(ip) ? '!text-slate-200 !bg-accent/20' : ''}">
                            ${svg(ICON.arrowRight, 'transition-transform ' + (graficosAbertos.has(ip) ? 'rotate-180' : ''))}
                        </button>
                        <button type="button" data-remover="${esc(ip)}" title="Remover este node do painel"
                            aria-label="Remover node ${esc(ip)}" class="btn btn-danger !px-3">${svg(ICON.unlink)}</button>
                    </div>
                </article>`;
            };

            const emptyState = () => `
                <div class="col-span-full text-center py-16 px-5 border border-dashed border-slate-400/15 rounded-2xl text-muted">
                    ${svg(ICON.server, 'w-11 h-11 opacity-50 mx-auto mb-3.5')}
                    <h3 class="text-base font-semibold text-slate-200 mb-1.5">Nenhum node conectado</h3>
                    <p class="text-[13px] mb-4">Inicie o agente no celular (<code>bash android/run.sh -d</code>) e adicione-o pelo IP ou pela varredura de rede.</p>
                    <button type="button" class="btn btn-primary" data-abrir-adicionar>${svg(ICON.plus)}Adicionar node</button>
                </div>`;

            function render(nodes) {
                const entries = Object.entries(nodes || {});
                $('statNodes').textContent = entries.length;
                $('statOnline').textContent = entries.filter(([, i]) => isOnline(i)).length;
                $('statWorkers').textContent = entries.reduce((a, [, i]) => a + (i.workers || []).length, 0);
                $('nodeCount').textContent = `${entries.length} ${entries.length === 1 ? 'node' : 'nodes'}`;
                $('updatedAt').textContent = new Date().toLocaleTimeString('pt-BR');

                if (!entries.length) { grid.innerHTML = emptyState(); return; }
                entries.sort((a, b) => isOnline(b[1]) - isOnline(a[1]));
                // O card do gráfico entra logo depois do card do node: no grid ele fica ao lado
                grid.innerHTML = entries.map(([ip, info]) =>
                    nodeCard(ip, info) + (graficosAbertos.has(ip) ? cardGrafico(ip) : '')).join('');
                // Redesenha na hora com a série já conhecida e depois busca a nova
                for (const ip of graficosAbertos) if (ultimoHistorico.has(ip)) desenharGrafico(ip, ultimoHistorico.get(ip));
                atualizarGraficos();
            }

            async function fetchNodes() {
                try {
                    const res = await fetch('/api/nodes');
                    render(await res.json());
                } catch (err) {
                    grid.innerHTML = `<div class="col-span-full text-center py-16 text-muted"><h3 class="text-base font-semibold text-slate-200 mb-1.5">Falha ao consultar o host</h3><p class="text-[13px]">${esc(err.message)}</p></div>`;
                }
            }

            $('btnRefresh').addEventListener('click', () => { grid.innerHTML = skeletons; fetchNodes(); });

            // ---- Adicionar node: por IP ou pela varredura de rede ----
            const painel = $('painelAdicionar');
            async function abrirAdicionar(abrir = true) {
                painel.classList.toggle('hidden', !abrir);
                $('btnAdicionar').setAttribute('aria-expanded', String(abrir));
                if (abrir && !$('redeVarredura').value) {
                    try { $('redeVarredura').value = (await (await fetch('/api/rede')).json()).rede; } catch (e) { }
                }
                if (abrir) $('ipNovo').focus();
            }
            $('btnAdicionar').addEventListener('click', () => abrirAdicionar(painel.classList.contains('hidden')));
            $('btnFecharAdicionar').addEventListener('click', () => abrirAdicionar(false));
            $('view').addEventListener('click', (e) => { if (e.target.closest('[data-abrir-adicionar]')) abrirAdicionar(true); });

            async function adicionar(ip, botao) {
                if (botao) { botao.disabled = true; botao.innerHTML = '<span class="spinner"></span>Pareando…'; }
                try {
                    const res = await fetch('/api/nodes/adicionar', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ip }),
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) { toast(data.erro || 'Falha ao adicionar'); return false; }
                    toast(`Node ${ip} adicionado`);
                    fetchNodes();
                    return true;
                } catch (e) { toast('Falha ao adicionar'); return false; }
                finally { if (botao) { botao.disabled = false; botao.innerHTML = `${svg(ICON.plus)}Adicionar`; } }
            }

            $('formAdicionarIp').addEventListener('submit', async (e) => {
                e.preventDefault();
                const ip = $('ipNovo').value.trim();
                if (await adicionar(ip, e.submitter)) $('ipNovo').value = '';
            });

            $('formVarredura').addEventListener('submit', async (e) => {
                e.preventDefault();
                const alvo = $('resultadoVarredura'), btn = $('btnVarrer');
                btn.disabled = true;
                alvo.innerHTML = '<div class="flex items-center gap-2.5 text-[13px] text-muted"><span class="spinner"></span>Procurando agentes DroidServer na rede (porta 5051)…</div>';
                try {
                    const res = await fetch('/api/varredura', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ rede: $('redeVarredura').value.trim() }),
                    });
                    const data = await res.json();
                    if (!res.ok) { alvo.innerHTML = `<p class="text-[13px] text-bad">${esc(data.erro || 'Falha na varredura')}</p>`; return; }
                    const cab = `<p class="text-[12px] text-muted mb-2">${data.enderecos} endereços de ${esc(data.rede)} em ${data.duracao_s}s · ${data.nodes.length} node(s) encontrado(s)</p>`;
                    if (!data.nodes.length) {
                        alvo.innerHTML = cab + '<p class="text-[13px] text-muted">Nenhum agente respondeu. Confira se o agente está rodando e se o celular está nesta rede.</p>';
                        return;
                    }
                    alvo.innerHTML = cab + '<div class="flex flex-col gap-2">' + data.nodes.map(n => {
                        const estado = n.cadastrado ? '<span class="pill pill-online">neste painel</span>'
                            : n.pareado ? `<span class="pill pill-warn" title="Pareado com ${esc(n.host || '?')}">pareado com ${esc(n.host || 'outro host')}</span>`
                                : '<span class="pill pill-muted">disponível</span>';
                        const acao = n.cadastrado ? ''
                            : `<button type="button" class="btn btn-success !py-2" data-adicionar-ip="${esc(n.ip)}">${svg(ICON.plus)}Adicionar</button>`;
                        return `
                        <div class="flex items-center justify-between gap-3 flex-wrap px-3.5 py-3 rounded-xl border border-slate-400/15 bg-slate-950/35">
                            <div class="flex items-center gap-3 min-w-0">
                                ${svg(ICON.server, 'w-5 h-5 text-accent2 shrink-0')}
                                <div class="min-w-0">
                                    <div class="text-[14px] font-bold">${esc(n.ip)}</div>
                                    <div class="text-[11.5px] text-muted truncate">${esc(n.modelo || 'Android')}${n.android ? ' · Android ' + esc(n.android) : ''}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2.5">${estado}${acao}</div>
                        </div>`;
                    }).join('') + '</div>';
                } catch (err) {
                    alvo.innerHTML = '<p class="text-[13px] text-bad">Falha ao consultar o host.</p>';
                } finally { btn.disabled = false; }
            });

            $('resultadoVarredura').addEventListener('click', async (e) => {
                const b = e.target.closest('[data-adicionar-ip]');
                if (b && await adicionar(b.dataset.adicionarIp, b)) $('formVarredura').requestSubmit();
            });

            // Seta do card do node: abre/fecha o gráfico ao lado
            grid.addEventListener('click', async (e) => {
                const rem = e.target.closest('[data-remover]');
                if (rem) {
                    const ip = rem.dataset.remover;
                    if (!confirm(`Remover o node ${ip} do painel? O celular deixa de sincronizar até ser adicionado de novo. Os workers no aparelho não são apagados.`)) return;
                    try {
                        const data = await (await fetch(`/api/nodes/${encodeURIComponent(ip)}/remover`, { method: 'POST' })).json();
                        toast(data.despareado ? `Node ${ip} removido` : `Node ${ip} removido do painel (o celular não respondeu)`);
                    } catch (err) { toast('Falha ao remover'); }
                    graficosAbertos.delete(ip);
                    return fetchNodes();
                }
                const btn = e.target.closest('[data-grafico]');
                if (!btn) return;
                const ip = btn.dataset.grafico;
                if (graficosAbertos.has(ip)) graficosAbertos.delete(ip); else graficosAbertos.add(ip);
                fetchNodes();
            });

            fetchNodes();
            const timer = setInterval(fetchNodes, 5000);
            const onUpd = () => fetchNodes();
            socket.on('node_updated', onUpd);
            cleanup = () => { clearInterval(timer); socket.off('node_updated', onUpd); };
        }

        // =====================================================================
        // VIEW: Detalhe do node
        //   GET  /api/node/<ip>
        //   POST /deploy_worker
        //   POST /node/<ip>/worker/<alias>/delete
        // =====================================================================
        function viewNode(ip) {
            setNav(ip);
            setFooter(`<div class="flex items-center gap-2"><span class="dot dot-online !w-[9px] !h-[9px]"></span>Atualização ao vivo</div>`);

            $('view').innerHTML = `
            <div class="max-w-[1400px] px-5 md:px-10 pt-6 md:pt-9 pb-14">
                <header class="flex items-end justify-between gap-4 flex-wrap mb-7">
                    <div>
                        <h1 class="section-title text-[26px] tracking-tight">Node <span class="text-accent2">${esc(ip)}</span></h1>
                        <p class="mt-1.5 text-[13.5px] text-muted" id="heroSub">Carregando...</p>
                        <div class="mt-3">${abasNode(ip, 'geral')}</div>
                    </div>
                    <a href="/" data-link class="btn btn-ghost">${svg(ICON.back)}Voltar ao Dashboard</a>
                </header>

                <section class="hero p-6 md:p-7 mb-7">
                    <div class="flex items-center justify-between gap-5 flex-wrap">
                        <div class="flex items-center gap-4">
                            <div class="w-[54px] h-[54px] rounded-2xl grid place-items-center shrink-0 bg-accent text-white shadow-lg shadow-accent/30">${svg(ICON.server, 'w-[26px] h-[26px]')}</div>
                            <div>
                                <h2 class="text-xl font-bold tracking-tight">${esc(ip)}</h2>
                                <p class="mt-1 text-[12.5px] text-muted" id="heroLastSeen">Último contato: —</p>
                            </div>
                        </div>
                        <div class="flex gap-2.5 flex-wrap" id="heroPills"></div>
                    </div>
                    <div class="flex gap-6 flex-wrap mt-5 pt-5 border-t border-slate-400/15" id="heroMetrics"></div>
                </section>

                <div class="card card-static p-5 mb-7">
                    <h3 class="text-[15px] font-bold mb-1">Criar novo worker</h3>
                    <p class="text-[12.5px] text-muted mb-4" id="deployAjuda"></p>
                    <form id="deployForm" class="flex gap-3 items-end flex-wrap">
                        <div class="w-full sm:w-52">
                            <label for="tipo" class="block text-[11px] uppercase tracking-wider text-muted font-semibold mb-2">Tipo</label>
                            <select class="input cursor-pointer [&>option]:bg-[#16213e]" id="tipo" name="tipo">
                                <option value="linux" selected>Ambiente Linux</option>
                                <option value="postgres">Banco PostgreSQL</option>
                            </select>
                        </div>
                        <div class="w-full sm:w-48" id="campoImagem">
                            <label for="imagem" class="block text-[11px] uppercase tracking-wider text-muted font-semibold mb-2">Distribuição</label>
                            <select class="input cursor-pointer [&>option]:bg-[#16213e]" id="imagem" name="imagem">
                                <option value="alpine" selected>Alpine (recomendado)</option>
                                <option value="debian">Debian</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[220px]">
                            <label for="alias" class="block text-[11px] uppercase tracking-wider text-muted font-semibold mb-2">Alias do worker</label>
                            <input class="input" type="text" id="alias" name="alias" placeholder="ex: alpine_bd" required pattern="[A-Za-z0-9_\\-]{1,64}" autocomplete="off">
                        </div>
                        <label id="campoIsolado" class="flex items-center gap-2.5 px-3.5 py-2.5 bg-slate-950/45 border border-slate-400/15 rounded-xl cursor-pointer select-none" title="Não monta o home do Termux nem o armazenamento do aparelho dentro do container. apt/apk/pacman continuam funcionando.">
                            <input type="checkbox" id="isolado" name="isolado" checked class="w-4 h-4 accent-accent cursor-pointer">
                            <span class="text-[13px] font-medium">Isolar do host</span>
                        </label>
                        <button type="submit" class="btn btn-success">${svg(ICON.plus)}Criar worker</button>
                    </form>
                </div>

                <div id="pendingCard"></div>
                <div id="resultsCard"></div>
                <div id="tunnelCard"></div>
                <div id="workersSection"></div>
            </div>`;

            let notFound = false;

            function renderHero(n) {
                const online = isOnline(n);
                $('heroSub').innerText = online ? 'Node online — atualização em tempo real.' : 'Node offline — aguardando o dispositivo voltar.';
                $('heroLastSeen').innerText = 'Último contato: ' + (n.last_seen || '—');
                $('heroPills').innerHTML = `
                    <span class="pill ${online ? 'pill-online' : 'pill-offline'}">${esc(n.status || 'Offline')}</span>
                    <span class="pill pill-muted">${(n.workers || []).length} workers</span>`;
                const mem = n.mem || {};
                const memSub = mem.total ? `${fmtBytes(mem.usado)} / ${fmtBytes(mem.total)}` : '';
                $('heroMetrics').innerHTML = cpuBars(n) + metricBar('RAM', mem.percent, memSub);
            }

            function renderPending(n) {
                const pend = n.tarefas_pendentes || [];
                const atual = n.tarefa_atual;
                const el = $('pendingCard');
                if (!pend.length && !atual) { el.innerHTML = ''; return; }

                const item = (spin, verbo, alias, extra) => `
                    <div class="flex items-center gap-2.5 text-[13.5px] text-muted">
                        <span class="spinner ${spin}"></span>
                        <span>${verbo} <strong class="text-slate-200">${esc(alias)}</strong> (${extra})</span>
                    </div>`;
                let items = '';
                const nome = (t) => ehTarefaTunnel(t) ? TUNNEL : t.alias;
                if (atual) items += item('', textoTarefa(atual.acao, 0), nome(atual), 'executando agora');
                pend.forEach(t => items += item('spinner-muted', textoTarefa(t.acao, 1), nome(t), 'aguardando o node'));

                el.innerHTML = `
                <div class="card card-static p-5 mb-7">
                    <h3 class="text-[15px] font-bold mb-1">Em processamento</h3>
                    <p class="text-[12.5px] text-muted mb-4">O node processa as tarefas em segundo plano — criar um container pode levar alguns minutos.</p>
                    <div class="flex flex-col gap-2">${items}</div>
                </div>`;
            }

            function renderResults(n) {
                const res = n.resultados || [];
                const el = $('resultsCard');
                if (!res.length) { el.innerHTML = ''; return; }
                const items = res.slice().reverse().map(r => `
                    <div class="flex items-start gap-2.5 text-[13px] px-3 py-2.5 rounded-xl border bg-slate-950/35 ${r.ok ? 'border-ok/30' : 'border-bad/30'}">
                        <span class="font-bold shrink-0 leading-tight ${r.ok ? 'text-ok' : 'text-bad'}">${r.ok ? '✓' : '✗'}</span>
                        <span>
                            ${textoTarefa(r.acao, 2)}
                            ${r.alias ? `<strong>${esc(r.alias)}</strong>` : ''}
                            — ${esc(r.msg)}
                            ${r.ts ? `<span class="text-muted text-[11px] ml-1.5">${esc(r.ts)}</span>` : ''}
                        </span>
                    </div>`).join('');
                el.innerHTML = `
                <div class="card card-static p-5 mb-7">
                    <h3 class="text-[15px] font-bold mb-3">Últimas operações</h3>
                    <div class="flex flex-col gap-2">${items}</div>
                </div>`;
            }

            function renderWorkers(n) {
                const workers = n.workers || [];
                const ws = n.worker_status || {};
                const cw = n.cpu_workers || {};
                const el = $('workersSection');
                const plural = workers.length === 1 ? 'worker' : 'workers';
                const head = `
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[17px] font-bold">Workers ativos</h2>
                        <span class="text-[12.5px] text-muted bg-slate-400/10 px-2.5 py-1 rounded-full">${workers.length} ${plural}</span>
                    </div>`;

                if (!workers.length) {
                    el.innerHTML = head + `
                    <div class="text-center py-16 px-5 border border-dashed border-slate-400/15 rounded-2xl text-muted">
                        ${svg(ICON.box, 'w-11 h-11 opacity-50 mx-auto mb-3.5')}
                        <h3 class="text-base font-semibold text-slate-200 mb-1.5">Nenhum worker criado</h3>
                        <p class="text-[13px]">Crie o primeiro container usando o formulário acima.</p>
                    </div>`;
                    return;
                }

                // Workers com deleção pendente/em execução
                const removendo = new Set(
                    [...(n.tarefas_pendentes || []), ...(n.tarefa_atual ? [n.tarefa_atual] : [])]
                        .filter(t => t.acao === 'deletar_worker').map(t => t.alias)
                );
                const TONES = {
                    ok: { bar: 'from-ok to-emerald-300', pill: 'pill-online', dot: 'bg-ok' },
                    warn: { bar: 'from-warn to-amber-300', pill: 'pill-warn', dot: 'bg-warn' },
                    muted: { bar: 'from-slate-500 to-slate-400', pill: 'pill-muted', dot: 'bg-slate-400' },
                    bad: { bar: 'from-bad to-rose-300', pill: 'pill-offline', dot: 'bg-bad' },
                };

                const servicos = n.servicos || {};
                const cards = workers.map(w => {
                    const sv = servicos[w] || null;
                    const ehBanco = !!(sv && sv.tipo === 'postgres');
                    if (sv) (ehBanco ? workersBanco.add(ip + '|' + w) : workersBanco.delete(ip + '|' + w));
                    const apagando = removendo.has(w);
                    const e = estadoServico(sv, ws[w]);
                    const st = e.st;
                    const tone = apagando ? 'warn' : e.tone;
                    const label = apagando ? 'Removendo' : e.label;
                    const t = TONES[tone];

                    return `
                    <article class="card relative overflow-hidden p-5 pl-6 flex flex-col gap-4 ${apagando ? 'opacity-60' : ''}">
                        <div class="absolute inset-y-0 left-0 w-1 bg-gradient-to-b ${t.bar}"></div>

                        <div class="flex items-start justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="relative w-11 h-11 rounded-xl grid place-items-center shrink-0 bg-surface2 text-accent">
                                    ${svg(ehBanco ? ICON.db : ICON.box, 'w-5 h-5')}
                                    <span class="absolute -bottom-1 -right-1 w-3 h-3 rounded-full ring-2 ring-surface2 ${t.dot}"></span>
                                </div>
                                <div class="min-w-0">
                                    <div class="text-[15px] font-bold truncate" title="${esc(w)}">${esc(w)}</div>
                                    <div class="text-[11.5px] text-muted mt-0.5">${ehBanco ? `PostgreSQL${sv.porta ? ' · porta ' + esc(String(sv.porta)) : ''}` : 'Container Linux'}</div>
                                </div>
                            </div>
                            <span class="pill ${t.pill} shrink-0 flex items-center gap-1.5">
                                ${apagando ? '<span class="spinner !w-3 !h-3"></span>' : ''}${esc(label)}
                            </span>
                        </div>

                        <div class="grid grid-cols-3 gap-3 p-3 bg-slate-950/35 border border-slate-400/15 rounded-xl">
                            <div class="flex flex-col gap-1 min-w-0">
                                <span class="label-xs tracking-wider">Serviço</span>
                                <span class="text-[13px] font-semibold truncate font-mono">${ehBanco ? 'postgres' : (sv && sv.tem_script ? '/app/run.sh' : '—')}</span>
                            </div>
                            <div class="flex flex-col gap-1 min-w-0">
                                <span class="label-xs tracking-wider">No ar há</span>
                                <span class="text-[13px] font-semibold truncate">${sv && sv.uptime ? esc(sv.uptime) : '—'}</span>
                            </div>
                            <div class="flex flex-col gap-1 min-w-0" title="CPU do worker (serviço + terminal) em % do aparelho">
                                <span class="label-xs tracking-wider">CPU</span>
                                <span class="text-[13px] font-semibold truncate">${esc(fmtPct(cw[w]))}</span>
                            </div>
                        </div>

                        <div class="flex gap-2 mt-auto">
                            <a href="/node/${esc(ip)}/worker/${esc(w)}" data-link class="btn btn-primary flex-1">${svg(ICON.gear)}Serviço</a>
                            <a href="/node/${esc(ip)}/worker/${esc(w)}/terminal" data-link class="btn btn-dark !px-3" title="Abrir terminal" aria-label="Abrir terminal do worker ${esc(w)}">${svg(ICON.terminal)}</a>
                            ${ehBanco ? '' : `<a href="/node/${esc(ip)}/worker/${esc(w)}/arquivos" data-link class="btn btn-dark !px-3" title="Arquivos da pasta home" aria-label="Arquivos do worker ${esc(w)}">${svg(ICON.folder)}</a>`}
                            <button type="button" data-delete="${esc(w)}" ${apagando ? 'disabled' : ''} title="Apagar worker" aria-label="Apagar worker ${esc(w)}" class="btn btn-danger !px-3">${svg(ICON.trash)}</button>
                        </div>
                    </article>`;
                }).join('');

                el.innerHTML = head + `<div class="grid gap-4 grid-cols-[repeat(auto-fill,minmax(280px,1fr))]">${cards}</div>`;
            }

            // ---- Cloudflare Tunnel (cloudflared no Termux, um por node) ----
            const vigia = tunnelVigia(ip);
            let tunnelForm = false;  // formulário aberto (não redesenha enquanto o usuário digita)
            function renderTunnel(n) {
                const el = $('tunnelCard');
                const tn = n.tunnel || null;
                const tarefa = [n.tarefa_atual, ...(n.tarefas_pendentes || [])].find(ehTarefaTunnel);
                const perdida = vigia.atualizar(n);

                    </div>
                    <div class="flex rounded-xl bg-term border border-slate-400/15 focus-within:border-accent overflow-hidden">
                        <pre id="edLinhas" aria-hidden="true" class="select-none overflow-hidden shrink-0 py-3 pl-3 pr-2 text-right font-mono text-[13px] leading-relaxed text-slate-500 border-r border-slate-400/10">1</pre>
                        <textarea id="editor" spellcheck="false" rows="14" disabled aria-label="Conteúdo do /app/run.sh"
                            class="flex-1 min-w-0 font-mono text-[13px] leading-relaxed px-3 py-3 bg-transparent text-slate-200 outline-none resize-y whitespace-pre overflow-x-auto"
                            placeholder="Carregando o /app/run.sh…"></textarea>
                    </div>
                    <div id="edAvisos" class="flex flex-col gap-2"></div>
                    <p class="text-[11.5px] text-muted">Primeiro plano, <code>exec</code> no último comando e <code># droidserver: porta=N</code> para o painel saber o endereço. Instale programas pelo <a class="underline" href="/node/${esc(ip)}/worker/${esc(alias)}/terminal" data-link>Terminal</a>. Dúvidas? Clique em <strong>?</strong>.</p>
                </section>

                ${htmlLogs('Logs')}
            </div>
            <div id="ajudaFundo" class="fixed inset-0 z-40 bg-black/50 hidden"></div>
            <aside id="ajudaPainel" role="dialog" aria-modal="true" aria-labelledby="ajudaTitulo" tabindex="-1"
                class="fixed top-0 right-0 z-50 h-full w-full md:w-[480px] bg-surface border-l border-slate-400/15 shadow-card overflow-y-auto px-6 pb-10 text-[13px] text-slate-300 leading-relaxed outline-none hidden">
                <div class="sticky top-0 -mx-6 px-6 py-4 bg-surface border-b border-slate-400/15 flex items-center justify-between">
                    <h2 id="ajudaTitulo" class="text-[16px] font-bold text-white">Como pôr sua aplicação no ar</h2>
                    <button type="button" id="ajudaFechar" class="btn btn-ghost !py-1 !px-2.5" aria-label="Fechar a ajuda">×</button>
                </div>
                ${ajudaServicoHtml(ip)}
            </aside>`;

            // ---- Ajuda ("?") ----
            let gatilhoAjuda = null;
            function abrirAjuda(secao, gatilho) {
                gatilhoAjuda = gatilho || document.activeElement;
                $('ajudaFundo').classList.remove('hidden');
                $('ajudaPainel').classList.remove('hidden');
                $('ajudaPainel').focus();
                const alvo = document.getElementById(`ajuda-${secao}`);
                if (alvo) alvo.scrollIntoView({ block: 'start' });
            }
            function fecharAjuda() {
                if ($('ajudaPainel').classList.contains('hidden')) return;
                $('ajudaFundo').classList.add('hidden');
                $('ajudaPainel').classList.add('hidden');
                if (gatilhoAjuda && gatilhoAjuda.focus) gatilhoAjuda.focus();
            }
            $('view').addEventListener('click', (e) => {
                const b = e.target.closest('[data-ajuda]');
                if (b) abrirAjuda(b.dataset.ajuda, b);
            });
            $('ajudaFechar').addEventListener('click', fecharAjuda);
            $('ajudaFundo').addEventListener('click', fecharAjuda);
            const onTeclaAjuda = (e) => { if (e.key === 'Escape') fecharAjuda(); };
            document.addEventListener('keydown', onTeclaAjuda);

            // ---- Comandos (com resposta casada pelo req) ----
            const pendentes = new Map();
            function comando(acao, dados = {}) {
                return new Promise((resolve) => {
                    const req = ++reqSeq;
                    const timer = setTimeout(() => {
                        pendentes.delete(req);
                        resolve({ ok: false, msg: 'O node não respondeu (está online?).' });
                    }, 30000);
                    pendentes.set(req, (r) => { clearTimeout(timer); resolve(r); });
                    socket.emit('servico', { ip, alias, acao, dados, req });
                });
            }
            const onResposta = (r) => {
                const fn = pendentes.get(r.req);
                if (!fn) return;
                pendentes.delete(r.req);
                if (r.servico) mostrarEstado(r.servico);
                fn(r);
            };
            socket.on('servico_resposta', onResposta);

            // ---- Estado ----
            let ultimoEstado = null;
            const TOM_DOT = { ok: 'dot-online', warn: 'dot-idle', bad: 'dot-offline', muted: 'dot-idle' };
            const TOM_TXT = { ok: 'text-ok', warn: 'text-warn', bad: 'text-bad', muted: 'text-muted' };
            let cpuWorker;
            function mostrarVisaoGeral(sv) {
                const porta = sv.porta;
                const banco = sv.tipo === 'postgres';
                const url = porta && !banco ? `http://${ip}:${porta}/` : null;
                $('svEndereco').innerHTML = banco
                    ? (porta ? `<span class="font-mono text-slate-200">${esc(ip)}:${esc(String(porta))}</span>` : '—')
                    : url
                    ? `<a class="underline text-slate-200" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`
                    : (sv.porta === undefined ? '—' : '<span class="text-warn">Porta não informada</span> — declare <code># droidserver: porta=N</code> no run.sh');
                $('btnAbrir').classList.toggle('hidden', !url);
                if (url) $('btnAbrir').href = url;

                if (sv.falhas_hoje === undefined) $('svFalhas').textContent = '—';
                else {
                    const u = sv.ultima_falha;
                    $('svFalhas').innerHTML = `${esc(String(sv.falhas_hoje))} hoje` + (u
                        ? ` · última às ${esc(u.quando)} — <span class="text-bad">${esc(u.motivo)}</span> (código ${esc(String(u.codigo))})` : '');
                }

                $('svAlertaVersao').classList.toggle('hidden', !(banco && sv.incompativel));
                if (banco && sv.incompativel) {
                    $('svAlertaVersao').innerHTML = `<strong>Versão incompatível:</strong> os dados são do PostgreSQL ${esc(String(sv.versao_dados || '?'))}, mas o instalado é outro, então o serviço não sobe. Reinstale a versão antiga para exportar os dados, ou crie um worker novo e restaure um backup (README: <em>Atualizar a versão do PostgreSQL</em>).`;
                }

                const fmt = (v, suf) => (v === undefined || v === null ? '—' : `${String(v).replace('.', ',')}${suf}`);
