<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Orquestração - Cluster</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="10">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Cluster: Nodes Disponíveis</h2>
        <table class="table table-striped table-bordered mt-4 align-middle">
            <thead class="table-dark">
                <tr>
                    <th>IP do Node</th>
                    <th>Status</th>
                    <th>Último Contato</th>
                    <th>Opções</th>
                </tr>
            </thead>
            <tbody>
                {% if nodes %}
                    {% for ip, info in nodes.items() %}
                    <tr>
                        <td><strong>{{ ip }}</strong></td>
                        <td><span class="badge bg-success">{{ info.status }}</span></td>
                        <td>{{ info.last_seen }}</td>
                        <td>
                            <a href="/node/{{ ip }}" class="btn btn-sm btn-primary">Gerenciar Workers</a>
                        </td>
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr><td colspan="4" class="text-center py-4">Nenhum Node conectado.</td></tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</body>
</html>
