<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciar Node {{ ip }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Workers no Node: <span class="text-primary">{{ ip }}</span></h2>
            <a href="/" class="btn btn-outline-secondary">Voltar ao Início</a>
        </div>

        <div class="card mb-4 p-3 bg-white shadow-sm">
            <form action="/deploy_worker" method="POST" class="d-flex gap-3 align-items-end">
                <input type="hidden" name="ip" value="{{ ip }}">
                <div class="flex-grow-1">
                    <label class="form-label text-muted small mb-1">Nome do novo Worker (Alpine Alias)</label>
                    <input type="text" name="alias" placeholder="Ex: alpine_bd" required class="form-control">
                </div>
                <button type="submit" class="btn btn-success">Criar Container Alpine</button>
            </form>
        </div>

        <h4>Workers Ativos</h4>
        <div class="list-group">
            {% if node.workers %}
                {% for worker in node.workers %}
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ worker }}</strong> <span class="badge bg-secondary ms-2">Alpine</span>
                    </div>
                    <div>
                        <a href="/node/{{ ip }}/worker/{{ worker }}" class="btn btn-sm btn-dark">Abrir Terminal</a>
                        <a href="/node/{{ ip }}/worker/{{ worker }}/delete" class="btn btn-sm btn-danger">Apagar</a>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <p class="text-muted mt-3">Nenhum worker criado neste Node ainda.</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
