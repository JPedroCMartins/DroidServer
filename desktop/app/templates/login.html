<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroidServer — Entrar</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/droidserver-favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/poppins.css') }}">
    <style>
        /* Padrão visual do portfolio-page: fundo #1a1a2e, card #16213e, detalhe #0f3460, destaque #e94560. */
        :root {
            --dark-bg: #1a1a2e;
            --dark-card: #16213e;
            --dark-primary: #0f3460;
            --highlight: #e94560;
            --text-light: #f0f0f0;
            --text-secondary: #a7a9be;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-light);
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--dark-primary) 100%);
            display: grid;
            place-items: center;
            padding: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Brilho que segue o mouse (hero do portfolio) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle 600px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(233, 69, 96, .15), transparent 40%);
            pointer-events: none;
        }

        main {
            width: 100%;
            max-width: 400px;
            position: relative;
            animation: fadeUp .8s ease both;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }

        .marca { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 28px; }
        .marca .logo { width: 52px; height: 52px; filter: drop-shadow(0 0 10px rgba(233, 69, 96, .35)); }
        .marca strong { display: block; font-size: 18px; font-weight: 700; }
        .marca span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-secondary); }

        form {
            background: var(--dark-card);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
        }

        h1 { font-size: 24px; font-weight: 600; text-align: center; position: relative; margin-bottom: 30px; }
        h1::after {
            content: ''; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%);
            width: 60px; height: 4px; border-radius: 2px; background: var(--highlight);
        }

        label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }

        input[type=password] {
            width: 100%;
            font: inherit;
            font-size: 15px;
            color: var(--text-light);
            background: var(--dark-bg);
            border: 2px solid var(--dark-primary);
            border-radius: 8px;
            padding: 10px 14px;
            outline: none;
            transition: border-color .2s;
        }
        input[type=password]:focus { border-color: var(--highlight); }

        .erro { margin-top: 12px; font-size: 13px; color: #ff8fa3; }

        button {
            margin-top: 22px;
            width: 100%;
            font: inherit;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-light);
            background: var(--highlight);
            border: 2px solid var(--highlight);
            border-radius: 8px;
            padding: 11px;
            cursor: pointer;
            transition: all .3s;
        }
        button:hover, button:focus-visible { background: transparent; color: var(--highlight); }

        .dica { margin-top: 18px; text-align: center; font-size: 12px; color: var(--text-secondary); }
        .dica code { color: var(--text-light); }

        @media (prefers-reduced-motion: reduce) { main { animation: none; } button { transition: none; } }
    </style>
</head>

<body>
    <main>
        <div class="marca">
            <img class="logo" src="{{ url_for('static', filename='img/droidserver-icone.svg') }}" alt="">
            <div>
                <strong>DroidServer</strong>
                <span>Painel de orquestração</span>
            </div>
        </div>

        <form method="post" action="/login">
            <h1>Entrar</h1>
            <input type="hidden" name="proximo" value="{{ proximo }}">
            <label for="senha">Senha do painel</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
            {% if erro %}
            <p class="erro" role="alert">{{ erro }}</p>
            {% endif %}
            <button type="submit">Entrar</button>
        </form>
        <p class="dica">A senha é definida no Host pela variável <code>DROID_PANEL_PASSWORD</code>.</p>
    </main>

    <script>
        document.addEventListener('mousemove', (e) => {
            document.body.style.setProperty('--mouse-x', e.clientX + 'px');
            document.body.style.setProperty('--mouse-y', e.clientY + 'px');
        });
    </script>
</body>

</html>
