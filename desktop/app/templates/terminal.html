<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal {{ alias }} — DroidServer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div class="layout term-page">
        <aside class="sidebar" style="height:100vh; position:sticky; top:0;">
            <div class="brand">
                <div class="brand-icon">DS</div>
                <div class="brand-text">
                    <strong>DroidServer</strong>
                    <span>Cluster</span>
                </div>
            </div>

            <nav class="nav">
                <span class="nav-label">Menu</span>
                <a href="/" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="/node/{{ ip }}" class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                    Node {{ ip }}
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="legend">
                    <span class="status-dot online"></span>
                    Sessão ao vivo
                </div>
            </div>
        </aside>

        <main class="main" style="display:flex; flex-direction:column; min-height:100vh;">
            <header class="topbar" style="margin-bottom:14px;">
                <div>
                    <h1 style="display:flex; align-items:center; gap:10px;">
                        Terminal
                        <span class="chip">{{ alias }}</span>
                    </h1>
                    <p class="subtitle">Node {{ ip }} — sessão interativa via WebSocket.</p>
                </div>
                <div class="topbar-actions">
                    <span class="term-status">
                        <span class="status-dot idle" id="statusDot"></span>
                        <span id="status" style="color:#fbbf24;">Conectando...</span>
                    </span>
                    <a href="/node/{{ ip }}" class="btn btn-ghost btn-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                        Encerrar
                    </a>
                </div>
            </header>

            <div class="term-toolbar">
                <div class="term-toolbar-left">
                    <button class="btn btn-dark btn-sm" id="btnCopy" title="Copiar seleção (Ctrl+C com texto selecionado)" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copiar
                    </button>
                    <button class="btn btn-dark btn-sm" id="btnPaste" title="Colar no terminal (Ctrl+Shift+V)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><path d="m9 14 2 2 4-4"/></svg>
                        Colar
                    </button>
                    <button class="btn btn-dark btn-sm" id="btnClear" title="Limpar a tela">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 21 5-5"/><path d="m15 21 6-6"/><path d="M3 21h18"/><path d="m11.5 3.5 9 9-8 8h-1l-9-9z"/><path d="m3 21 5-5"/></svg>
                        Limpar
                    </button>
                </div>
                <div class="term-toolbar-right">
                    <button class="btn btn-ghost btn-sm" id="btnReconnect" title="Reconectar o WebSocket">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                        Reconectar
                    </button>
                    <button class="btn btn-ghost btn-sm" id="btnFullscreen" title="Tela cheia (ESC para sair)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        Tela cheia
                    </button>
                </div>
            </div>

            <div class="term-body" style="flex:1; min-height:0; padding:0;">
                <div class="term-shell" id="termShell" style="height:calc(100vh - 240px); min-height:420px;"></div>
            </div>

            <div class="term-hint">
                Clique no terminal para digitar · selecione para copiar (Ctrl+C) · cole com Ctrl+Shift+V
            </div>
        </main>
    </div>

    <div id="toast"></div>

    <script>
        const ipNode = "{{ ip }}";
        const aliasWorker = "{{ alias }}";

        // ============ Terminal ============
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            scrollback: 5000,
            fontFamily: '"JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, Consolas, monospace',
            theme: {
                background: '#050a15',
                foreground: '#e2e8f0',
                cursor: '#67e8f9',
                cursorAccent: '#050a15',
                selectionBackground: 'rgba(99,102,241,0.35)',
                black: '#050a15',
                red: '#f87171',
                green: '#34d399',
                yellow: '#fbbf24',
                blue: '#818cf8',
                magenta: '#c084fc',
                cyan: '#67e8f9',
                white: '#e2e8f0',
                brightBlack: '#64748b',
                brightRed: '#fb7185',
                brightGreen: '#6ee7b7',
                brightYellow: '#fcd34d',
                brightBlue: '#a5b4fc',
                brightMagenta: '#d8b4fe',
                brightCyan: '#a5f3fc',
                brightWhite: '#f8fafc'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('termShell'));
        fitAddon.fit();
        term.focus();

        term.write('\x1b[38;5;111mDroidServer\x1b[0m — Iniciando conexão com o host...\r\n\r\n');

        const socket = io();

        // ============ Status / toast ============
        const statusEl = document.getElementById('status');
        const statusDot = document.getElementById('statusDot');
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function setStatus(texto, cor, classe) {
            statusEl.innerText = texto;
            statusEl.style.color = cor;
            statusDot.className = 'status-dot ' + classe;
        }

        function toast(msg) {
            toastEl.innerText = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
        }

        // ============ Copiar ============
        const btnCopy = document.getElementById('btnCopy');

        async function copiar() {
            const selecao = term.getSelection();
            if (!selecao) return;
            try {
                await navigator.clipboard.writeText(selecao);
                toast('Copiado!');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = selecao;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                toast('Copiado!');
            }
            term.clearSelection();
        }

        term.onSelectionChange(() => {
            btnCopy.disabled = !term.hasSelection();
        });

        // Ctrl+C com texto selecionado copia em vez de enviar SIGINT
        term.attachCustomKeyEventHandler((e) => {
            if (e.type === 'keydown' && e.ctrlKey && !e.shiftKey && !e.altKey
                && e.key.toLowerCase() === 'c' && term.hasSelection()) {
                copiar();
                return false;
            }
            return true;
        });

        btnCopy.addEventListener('click', copiar);

        // ============ Colar ============
        // Converte \n -> \r para o PTY entender Enter (corrige colar códigos com várias linhas)
        function normalizarPaste(texto) {
            return texto.replace(/\r?\n/g, '\r');
        }

        function emitirPaste(texto) {
            const input = normalizarPaste(texto);
            if (input) socket.emit('terminal_input', { ip: ipNode, alias: aliasWorker, input });
        }

        // Detecta paste vindo do navegador (menu de contexto / Ctrl+V) no shell.
        // Usa fase de captura para marcar antes de o xterm disparar onData.
        let pasting = false;
        document.getElementById('termShell').addEventListener('paste', () => {
            pasting = true;
            setTimeout(() => { pasting = false; }, 300);
        }, true);

        term.onData(data => {
            let input = data;
            if (pasting) {
                pasting = false;
                input = normalizarPaste(data);
            }
            socket.emit('terminal_input', { ip: ipNode, alias: aliasWorker, input });
        });

        async function colar() {
            try {
                const texto = await navigator.clipboard.readText();
                if (texto) {
                    emitirPaste(texto);
                    toast('Colado!');
                    return;
                }
            } catch (e) { /* sem permissão de clipboard (http) — usa o fallback */ }

            // Fallback: caixa oculta que recebe o Ctrl+V do usuário
            const ta = document.createElement('textarea');
            ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            toast('Pressione Ctrl+V para colar...');
            ta.addEventListener('paste', (ev) => {
                ev.preventDefault();
                const texto = ev.clipboardData.getData('text');
                document.body.removeChild(ta);
                emitirPaste(texto);
                toast('Colado!');
            }, { once: true });
            setTimeout(() => { if (document.body.contains(ta)) document.body.removeChild(ta); }, 15000);
        }

        document.getElementById('btnPaste').addEventListener('click', colar);

        // ============ Limpar / Reconectar / Tela cheia ============
        document.getElementById('btnClear').addEventListener('click', () => term.clear());

        document.getElementById('btnReconnect').addEventListener('click', () => {
            toast('Reconectando...');
            if (socket.connected) socket.disconnect();
            socket.connect();
        });

        const btnFullscreen = document.getElementById('btnFullscreen');
        function toggleFullscreen() {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen().catch(() => toast('Tela cheia indisponível'));
        }
        btnFullscreen.addEventListener('click', toggleFullscreen);
        document.addEventListener('fullscreenchange', () => setTimeout(() => fitAddon.fit(), 80));

        // ============ Socket.IO ============
        socket.on('connect', () => {
            setStatus('Conectado ao Host. Aguardando Node...', '#34d399', 'online');
            sendResize();
        });

        socket.on('disconnect', () => {
            setStatus('Conexão perdida', '#f87171', 'offline');
        });

        socket.on(`output_for_${ipNode}_${aliasWorker}`, (data) => {
            term.write(data.output);
            if (statusDot.className === 'status-dot online') {
                setStatus('Node ativo', '#34d399', 'online');
            }
        });

        // Mantém o PTY no node sincronizado com o tamanho da janela do navegador
        function sendResize() {
            socket.emit('terminal_resize', {
                ip: ipNode,
                alias: aliasWorker,
                cols: term.cols,
                rows: term.rows
            });
        }

        term.onResize(sendResize);
        window.addEventListener('resize', () => { fitAddon.fit(); sendResize(); });
        window.addEventListener('orientationchange', () => { setTimeout(() => { fitAddon.fit(); sendResize(); }, 200); });
    </script>
</body>
</html>
