<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Terminal: {{ alias }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body { background-color: #1e1e1e; color: white; }
        #terminal-container { height: 70vh; width: 100%; padding: 10px; background: #000; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Terminal Web <span class="fs-5 text-warning">(Alpine: {{ alias }})</span></h3>
            <a href="/node/{{ ip }}" class="btn btn-outline-light btn-sm">Encerrar Sessão</a>
        </div>
        
        <div id="terminal-container"></div>
        <p class="text-white-50 mt-2 small">Node: {{ ip }} | Status: <span id="status" class="text-warning">Conectando...</span></p>
    </div>

    <script>
        // Inicializa o Terminal na tela
        const term = new Terminal({
            cursorBlink: true,
            theme: { background: '#000000' }
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        term.write('Iniciando conexão com o servidor Host...\r\n');

        // Conecta ao Flask via WebSocket
        const socket = io();

        const ipNode = "{{ ip }}";
        const aliasWorker = "{{ alias }}";

        socket.on('connect', () => {
            document.getElementById('status').innerText = 'Conectado ao Host. Aguardando Node...';
            document.getElementById('status').className = 'text-success';
        });

        // 1. Quando o usuário digita algo no navegador, manda pro Flask
        term.onData(data => {
            socket.emit('terminal_input', {
                ip: ipNode,
                alias: aliasWorker,
                input: data
            });
        });

        // 2. Quando o Flask recebe a resposta do celular, escreve no terminal web
        socket.on(`output_for_${ipNode}_${aliasWorker}`, (data) => {
            term.write(data.output);
        });

        // Redimensiona o terminal se a janela mudar de tamanho
        window.addEventListener('resize', () => { fitAddon.fit(); });
    </script>
</body>
</html>
